<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rush — suivre une partie à thèmes prédéfinis</title>
<style>
:root {
  --primary: #6D28D9; --primary-hover: #7C3AED; --primary-soft: rgba(109,40,217,.16);
  --background: #0F172A; --surface: #1E293B; --surface-2: #273449;
  --border: #334155; --text: #F8FAFC; --muted: #94A3B8; --muted-strong: #CBD5E1;
  --muted-2: #64748B; --success: #22C55E; --secondary: #F59E0B; --error: #EF4444;
  --t1: #d6336c; --t2: #33c26a;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #060B18; color: var(--text); padding: 22px 16px 60px; line-height: 1.5;
}
.wrap { max-width: 1020px; margin: 0 auto; }
h1 { font-size: 1.4rem; margin-bottom: 4px; }
.intro { color: var(--muted); font-size: .93rem; margin-bottom: 18px; }
.intro b { color: var(--muted-strong); }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.tab { background: var(--surface); color: var(--muted-strong); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 9px 15px; font-size: .86rem; font-weight: 600;
  cursor: pointer; font-family: inherit; }
.tab.on { background: var(--primary); border-color: var(--primary-hover); color: #fff; }
.tab .role { display: block; font-size: .66rem; text-transform: uppercase;
  letter-spacing: .05em; opacity: .7; }

.stage { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
.phone { width: 340px; flex-shrink: 0; background: var(--background);
  border: 1px solid var(--border); border-radius: 30px; overflow: hidden;
  box-shadow: 0 14px 44px rgba(0,0,0,.55); position: relative; }
.barre { display: flex; align-items: center; gap: 8px; padding: 13px 18px 11px;
  border-bottom: 1px solid var(--border); font-size: .74rem; color: var(--muted); }
.barre .marque { font-weight: 800; color: var(--text); }
.barre .qui { margin-left: auto; }
.corps { padding: 20px 18px 26px; text-align: center; min-height: 430px; }

/* Voile de dialogue, comme dans l'app */
.voile { position: absolute; inset: 0; background: rgba(6,11,24,.72);
  display: flex; align-items: center; justify-content: center; padding: 18px; }
.panneau { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 20px 18px; width: 100%; text-align: center; }
.panneau h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; }
.panneau p { font-size: .88rem; color: var(--muted-strong); margin-bottom: 16px; }

.btn { display: block; width: 100%; padding: 13px; border: 0; border-radius: var(--r-md);
  background: var(--primary); color: #fff; font-size: .98rem; font-weight: 700;
  font-family: inherit; cursor: pointer; }
.btn.sec { background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); margin-top: 9px; }
.btn:disabled { opacity: .35; cursor: default; }

.cap { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.code { font-size: 2.4rem; font-weight: 800; letter-spacing: .28em;
  color: var(--secondary); margin: 10px 0 4px; }
.qr { background: #fff; padding: 9px; border-radius: var(--r-md);
  width: fit-content; margin: 4px auto 10px; }
.adresse { font-size: .78rem; color: var(--muted-strong); background: var(--surface-2);
  border-radius: var(--r-sm); padding: 7px 9px; word-break: break-all; }

.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 6px; }
.themes button { background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 6px;
  font-size: .88rem; font-weight: 600; font-family: inherit; cursor: pointer; }
.themes button.on { background: var(--primary-soft); border-color: var(--primary-hover); }

.roue { font-size: 3rem; animation: tourne 4s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .roue { animation: none; } }
.icone { font-size: 2.6rem; margin: 6px 0 2px; }
.qui-joue { font-size: 1.05rem; font-weight: 700; }
.chrono-bloc { display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 6px 0; }
.nombre { font-size: 3.6rem; font-weight: 800; color: var(--secondary); line-height: 1; }
.scores { display: flex; justify-content: center; gap: 30px; margin-top: 12px; }
.eq { text-align: center; }
.eq .nom { font-size: .67rem; font-weight: 700; text-transform: uppercase; display: block; }
.eq.e1 .nom { color: var(--t1); } .eq.e2 .nom { color: var(--t2); }
.eq .gros { font-size: 1.9rem; font-weight: 800; }
.rappel { font-size: .82rem; color: var(--muted); margin-top: 6px; }

.notes { flex: 1; min-width: 260px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 16px; font-size: .9rem; }
.notes h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); margin-bottom: 10px; }
.notes p { margin-bottom: 10px; } .notes p:last-child { margin-bottom: 0; }
.plus::before { content: '＋ '; color: var(--success); font-weight: 700; }
.minus::before { content: '− '; color: var(--secondary); font-weight: 700; }
.question { background: rgba(245,158,11,.14); border-left: 3px solid var(--secondary);
  border-radius: 0 var(--r-md) var(--r-md) 0; padding: 11px 13px; margin-top: 12px;
  font-size: .87rem; color: var(--muted-strong); }
</style>
</head>
<body>
<div class="wrap">

  <h1>Suivre une partie à thèmes prédéfinis</h1>
  <p class="intro">Les cinq moments des trois US, dans l'ordre. Les écrans marqués
    <b>organisateur</b> et <b>invité</b> se répondent.</p>

  <div class="tabs" id="tabs"></div>

  <div class="stage">
    <div class="phone">
      <div class="barre" id="barre"></div>
      <div class="corps" id="corps"></div>
    </div>
    <div class="notes" id="notes"></div>
  </div>
</div>

<script type="module">
import { creerQrSvg } from './js/qr.js';

const LIEN = 'https://rush-alexina.vercel.app/rejoindre.html?c=7KP2';

let themeChoisi = null;

const ECRANS = {
  proposer: {
    onglet: 'Partager le suivi ?', role: 'organisateur · US 1',
    barre: ['Rush', 'déroulement'],
    corps: () => `
      <p class="cap">Déroulement</p>
      <div class="icone">⚙️</div>
      <p class="qui-joue" style="color:var(--muted)">40 s par tour · 30 cartes</p>
      <div class="voile">
        <div class="panneau">
          <h3>👀 Partager le suivi ?</h3>
          <p>Les autres joueurs pourront voir le chrono et les scores
             depuis leur téléphone.</p>
          <button class="btn">Oui, montrer le code</button>
          <button class="btn sec">Non, lancer directement</button>
        </div>
      </div>`,
    notes: `<p class="plus">Apparaît au clic sur « C'est parti », <b>et seulement
      s'il n'existe aucune session</b>. Elle se montre donc une fois par soirée :
      les parties suivantes réutilisent la même session et ne la reproposent pas.</p>
      <p class="plus">« Non » lance la partie immédiatement, comme aujourd'hui.
        Rien n'est créé, rien n'est consommé.</p>
      <p class="minus">Créer la session demande du réseau. En cas d'échec, je le dis
        et la partie démarre quand même, sans suivi — comme le repli déjà en place
        pour la saisie partagée.</p>`
  },

  qr: {
    onglet: 'Le code à montrer', role: 'organisateur · US 1',
    barre: ['Rush', 'suivi de partie'],
    corps: () => `
      <div class="voile" style="background:var(--background)">
        <div class="panneau" style="border:0;background:none">
          <h3>👀 Suivre la partie</h3>
          <p>Fais scanner ce code aux joueurs. Ils verront le chrono
             et les scores, jamais les cartes.</p>
          <div class="qr" id="qr"></div>
          <p class="code">7KP2</p>
          <p class="adresse">rush-alexina.vercel.app/rejoindre</p>
          <button class="btn sec" style="margin-top:14px">📤 Partager le lien</button>
          <button class="btn" style="margin-top:14px">C'est parti ! 🚀</button>
        </div>
      </div>`,
    notes: `<p class="plus">L'organisateur montre le code, attend que chacun scanne,
      puis lance quand il veut. Le départ reste son geste.</p>
      <p class="plus">Le bouton de partage est celui qui existe déjà : il ouvre le
        menu du téléphone et ne copie que le lien.</p>
      <p class="minus">Fermer sans lancer ramène au déroulement. La session reste
        créée : le code est valable pour toute la soirée.</p>`
  },

  invite: {
    onglet: 'Il scanne', role: 'invité · US 3',
    barre: ['Rush', 'tu suis la partie', '7KP2'],
    corps: () => `
      <div class="roue">⚙️</div>
      <h3 style="font-size:1.15rem;font-weight:800;margin:6px 0 4px">
        Configuration de la partie en cours</h3>
      <p class="cap" style="text-transform:none;font-size:.86rem">
        L'organisateur prépare la partie. Elle démarre juste après.</p>`,
    notes: `<p class="plus">Ni prénom, ni cartes : l'invité arrive <b>directement</b>
      sur le suivi. Il n'a rien à saisir dans une partie à thèmes.</p>
      <p class="plus">S'il scanne avant le lancement, il voit cet écran — celui qui
        existe déjà pour la saisie partagée. Dès que la partie démarre, il bascule
        sur le lancement de tour.</p>
      <p class="minus"><b>Conséquence assumée :</b> l'app ne sait pas qui regarde.
        Donc pas de « 🎯 c'est à toi », et pas de score personnel en fin de partie
        pour ces parties-là. À revoir si ça manque à l'usage.</p>`
  },

  tour: {
    onglet: 'La partie tourne', role: 'invité · US 3',
    barre: ['Rush', 'tu suis la partie', '7KP2'],
    corps: () => `
      <p class="cap">Manche 1/3 · Description libre</p>
      <div class="icone">💬</div>
      <p class="qui-joue"><span style="color:var(--t1)">Équipe 1</span> · Marc fait deviner</p>
      <div class="chrono-bloc"><span class="nombre">23</span></div>
      <div class="scores">
        <div class="eq e1"><span class="nom">Équipe 1</span><div class="gros">4</div></div>
        <div class="eq e2"><span class="nom">Équipe 2</span><div class="gros">3</div></div>
      </div>
      <p class="rappel">Total de la partie : 17 – 16</p>`,
    notes: `<p class="plus">À partir de là, rien de nouveau : ce sont les écrans
      déjà construits pour la saisie partagée — lancement de tour, sablier,
      fin de manche, fin de partie.</p>
      <p class="plus">C'est tout l'intérêt de la marque « suivi seulement » :
        elle ne change que l'<i>entrée</i>, pas la suite.</p>`
  },

  rejeu: {
    onglet: 'Rejouer', role: 'organisateur · US 2',
    barre: ['Rush', 'nouvelle partie'],
    corps: () => `
      <p class="cap">Choisis un thème</p>
      <div class="themes" id="themes">
        ${['🎬 Films', '🎵 Musique', '🌍 Géographie', '🐾 Animaux']
          .map(t => `<button data-theme="${t}"${themeChoisi === t ? ' class="on"' : ''}>${t}</button>`)
          .join('')}
      </div>
      <p class="cap" style="text-transform:none;font-size:.82rem">
        ${themeChoisi ? 'Prêt à lancer.' : 'Le paquet sera renouvelé.'}</p>
      <button class="btn" style="margin-top:16px"${themeChoisi ? '' : ' disabled'}>
        C'est parti ! 🚀</button>`,
    notes: `<p class="plus">« Rejouer » mène au choix du thème, et non plus
      directement au jeu : un nouveau paquet, sans repasser par les équipes
      ni les manches, qui n'ont pas changé.</p>
      <p class="plus">Le bouton s'active au premier thème choisi — clique pour voir.</p>
      <div class="question"><b>Ma question :</b> ce parcours vaut-il aussi pour une
        partie <b>non suivie</b> ? Ton US parle d'« une partie qui est suivie ».
        Aujourd'hui « Rejouer » relance avec les mêmes thèmes, sans rien demander.
        Je limite le changement aux parties suivies, ou je l'applique partout ?</div>`
  },

  rejeuInvite: {
    onglet: 'Pendant ce temps', role: 'invité · US 2',
    barre: ['Rush', 'tu suis la partie', '7KP2'],
    corps: () => `
      <div class="roue">⚙️</div>
      <h3 style="font-size:1.15rem;font-weight:800;margin:6px 0 4px">
        Configuration de la partie en cours</h3>
      <p class="cap" style="text-transform:none;font-size:.86rem">
        L'organisateur prépare la partie. Elle démarre juste après.</p>`,
    notes: `<p class="plus">Le même écran que lors du scan : l'invité voit la roue
      tourner tant que l'organisateur n'a pas choisi son thème.</p>
      <p class="plus">Aucun écran à créer — il existe déjà. Il suffit de publier
        l'étape « configuration » à l'arrivée sur le choix du thème.</p>
      <p class="minus">Le texte parle des « équipes et des manches », ce qui est faux
        ici : l'organisateur ne choisit qu'un thème. À reformuler, ou à laisser
        volontairement vague — dis-moi.</p>`
  }
};

let courant = 'proposer';
const tabs = document.getElementById('tabs');

Object.entries(ECRANS).forEach(([cle, e]) => {
  const b = document.createElement('button');
  b.className = 'tab' + (cle === courant ? ' on' : '');
  b.dataset.ecran = cle;
  b.innerHTML = `<span class="role">${e.role}</span>${e.onglet}`;
  tabs.appendChild(b);
});

function rendre() {
  const e = ECRANS[courant];
  const b = e.barre;
  document.getElementById('barre').innerHTML =
    `<span class="marque">${b[0]}</span><span>${b[1]}</span>` +
    (b[2] ? `<span class="qui">${b[2]}</span>` : '');
  document.getElementById('corps').innerHTML = e.corps();
  document.getElementById('notes').innerHTML = '<h3>Ce qu\'il faut savoir</h3>' + e.notes;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.ecran === courant));

  const boite = document.getElementById('qr');
  if (boite) boite.appendChild(creerQrSvg(LIEN, { taille: 150 }));

  const themes = document.getElementById('themes');
  if (themes) themes.addEventListener('click', ev => {
    const t = ev.target.closest('button');
    if (!t) return;
    themeChoisi = themeChoisi === t.dataset.theme ? null : t.dataset.theme;
    rendre();
  });
}

tabs.addEventListener('click', ev => {
  const t = ev.target.closest('.tab');
  if (!t) return;
  courant = t.dataset.ecran;
  rendre();
});

rendre();
</script>
</body>
</html>
