<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — interruption en plein tour</title></head>
<body>
<pre id="log">demarrage...</pre>
<iframe id="f" src="/" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

const f = document.getElementById('f');
f.addEventListener('load', async () => {
  const d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, src, l) => log('ERREUR APP: ' + m + ' @' + src + ':' + l);
  const $ = id => d.getElementById(id);
  const screen = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;

  try {
    await wait(1200);
    d.getElementById('btn-start').click();
    d.querySelector('[data-source="themes"]').click();
    d.querySelectorAll('#theme-selector .btn-theme')[0].click();
    $('btn-next-step').click();
    d.querySelector('[data-mode="simple"]').click();
    $('btn-repartition-jouer').click();
    $('btn-next-rounds').click();
    $('btn-play').click();
    // Parties a themes : l app propose de partager le suivi avant de lancer
    $('dialog-cancel').click();
    await wait(0);
    check('partie lancee', screen() === 'screen-round');

    $('btn-start-turn').click();
    check('tour lance', screen() === 'screen-game');
    $('btn-found').click();
    $('btn-found').click();

    // on laisse tourner le chrono quelques secondes avant de "couper" l'app
    await wait(6000);

    const snap = JSON.parse(w.localStorage.getItem('timesup_partie_en_cours'));
    log('       chrono affiche : ' + $('timer').textContent + ' / sauvegarde : ' + snap.state.timeLeft);
    check('le tour est marque comme en cours', snap.state.turnActive === true);
    check('le chrono est sauvegarde a la seconde pres', snap.state.timeLeft === parseInt($('timer').textContent, 10));
    check('le chrono a bien tourne (< 40)', snap.state.timeLeft < 40 && snap.state.timeLeft > 0);
    check('les 2 cartes du tour sont sauvegardees', snap.state.turnScore === 2);
    check('la position dans le paquet est sauvegardee', snap.state.currentCardIndex === 2);
    check('la carte affichee correspond a la sauvegarde', snap.state.deck[snap.state.currentCardIndex] === $('card-word').textContent);

    log('SCENARIO 3 TERMINE (app coupee en plein tour)');
  } catch (e) {
    log('EXCEPTION: ' + e.message + '\n' + e.stack);
  }
});
</script>
</body>
</html>
