<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — reprise hors tour</title></head>
<body>
<pre id="log">demarrage...</pre>
<iframe id="f" src="/" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('f').addEventListener('load', async () => {
  const f = document.getElementById('f'), d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const screen = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  try {
    await wait(1200);
    const detail = $('resume-detail').textContent;
    log('       resume affiche :\n         ' + detail.split('\n').join('\n         '));
    check('bloc Reprendre visible', $('resume-block').style.display !== 'none');
    check('aucun tour en cours annonce', !detail.includes('tour en cours'));
    check('ligne 1 : manche seule', detail.split('\n')[0] === 'Manche 1 sur 3');
    check('ligne 2 : score nomme par equipe', /^.+ : 0 {2}— {2}.+ : 0$/.test(detail.split('\n')[1]));

    $('btn-resume').click();
    check('reprise sur l ecran de debut de tour', screen() === 'screen-round');
    check('scores a zero conserves', $('round-team1-score').textContent === '0');
    check('bon libelle de manche', $('round-title').textContent === 'Manche 1/3');

    $('btn-start-turn').click();
    check('le tour demarre normalement', screen() === 'screen-game');
    check('chrono a 40 s (tour neuf)', $('timer').textContent === '40');
    check('paquet complet (30 cartes)', $('cards-left').textContent === '30');

    w.confirmQuit();
    check('une confirmation maison s ouvre', $('dialog-overlay').style.display !== 'none');
    check('elle nomme l action', $('dialog-title').textContent.includes('Quitter la partie'));
    check('elle rassure sur la reprise', $('dialog-message').textContent.includes('reprendre'));
    $('dialog-confirm').click();
    await wait(0);
    check('retour a l accueil apres avoir quitte', screen() === 'screen-home');
    check('la partie est conservee apres avoir quitte', w.localStorage.getItem('timesup_partie_en_cours') !== null);
    check('bloc Reprendre propose immediatement', $('resume-block').style.display !== 'none');
    check('le resume mentionne le tour en cours', $('resume-detail').textContent.includes('tour en cours'));
    log('SCENARIO 6 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message); }
});
</script>
</body>
</html>
