<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — vibration coupee, son actif</title></head>
<body>
<pre id="log">demarrage...</pre>
<iframe id="f" src="/" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('f').addEventListener('load', async () => {
  const f = document.getElementById('f'), d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const screen = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;

  let oscs = 0;
  const AC = w.AudioContext || w.webkitAudioContext;
  const orig = AC.prototype.createOscillator;
  AC.prototype.createOscillator = function () { oscs++; return orig.apply(this, arguments); };

  const vibrations = [];
  Object.defineProperty(w.navigator, 'vibrate', {
    value: p => { vibrations.push(p); return true; }, configurable: true, writable: true
  });

  try {
    await wait(1200);

    // --- On coupe uniquement la vibration ---
    $('btn-settings').click();
    d.querySelector('[data-vibration="off"]').click();
    check('vibration coupee selectionnee', d.querySelector('[data-vibration="off"]').classList.contains('active'));
    check('preference vibration enregistree', w.localStorage.getItem('timesup_vibration') === 'off');
    check('le son reste active (reglage independant)', d.querySelector('[data-sound="on"]').classList.contains('active'));
    check('la preference son n a pas ete touchee', w.localStorage.getItem('timesup_son') === null);
    $('btn-settings-back').click();

    $('btn-start').click();
    $('btn-next-mode').click();
    d.querySelectorAll('#theme-selector .btn-theme')[0].click();
    $('btn-next-step').click();
    d.querySelector('[data-mode="simple"]').click();
    $('btn-next-players').click();
    $('btn-next-rounds').click();
    $('btn-play').click();
    $('btn-start-turn').click();

    let n = 0;
    while (screen() !== 'screen-turn-end' && n < 60) { await wait(1000); n++; }
    check('le tour s est termine normalement', screen() === 'screen-turn-end');

    log('       oscillateurs crees : ' + oscs + ' / vibrations : ' + vibrations.length);
    check('le son continue de fonctionner (5 tics + buzzer)', oscs === 7);
    check('aucune vibration declenchee', vibrations.length === 0);

    log('SCENARIO 15 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
