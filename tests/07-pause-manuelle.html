<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — pause « le sas »</title></head>
<body>
<pre id="log">demarrage...</pre>
<iframe id="f" src="/" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('f').addEventListener('load', async () => {
  const f = document.getElementById('f'), d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const screen = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const sauvegarde = () => JSON.parse(w.localStorage.getItem('timesup_partie_en_cours'));
  const voile = () => $('pause-overlay').style.display !== 'none';
  const floute = () => $('screen-game').classList.contains('paused');

  let oscs = 0;
  const AC = w.AudioContext || w.webkitAudioContext;
  const orig = AC.prototype.createOscillator;
  AC.prototype.createOscillator = function () { oscs++; return orig.apply(this, arguments); };

  try {
    await wait(1200);
    $('btn-start').click();
    $('btn-next-mode').click();
    d.querySelectorAll('#theme-selector .btn-theme')[0].click();
    $('btn-next-step').click();
    d.querySelector('[data-mode="simple"]').click();
    $('btn-next-players').click();
    $('btn-next-rounds').click();
    $('btn-play').click();
    $('btn-start-turn').click();

    check('bouton pause present', !!$('btn-pause'));
    check('le bouton pause est a gauche', $('btn-pause').classList.contains('btn-pause'));
    check('aucun voile au demarrage', !voile() && !floute());

    $('btn-found').click();
    const carteAvant = $('card-word').textContent;
    await wait(4000);

    // ===== Mise en pause =====
    const chrono = parseInt($('timer').textContent, 10);
    $('btn-pause').click();
    check('on reste sur l ecran de jeu (voile, pas changement d ecran)', screen() === 'screen-game');
    check('le voile est affiche', voile());
    check('le jeu est floute sous le voile', floute());
    check('le panneau de pause est visible', $('pause-panel').style.display !== 'none');
    check('le decompte n est pas encore affiche', $('pause-countdown').style.display === 'none');
    log('       panneau : "' + $('pause-info').textContent + '"');
    check('le panneau rappelle manche et temps', $('pause-info').textContent === 'Manche 1/3 · il reste ' + chrono + ' s');
    // L'equipe qui ouvre la partie est tiree au sort : on lit le score de celle qui joue
    const equipeQuiJoue = sauvegarde().state.currentTeam;
    const scores = [$('pause-team1-score').textContent, $('pause-team2-score').textContent];
    check('le panneau rappelle le score de l equipe qui joue', scores[equipeQuiJoue] === '1');
    check('et celui de l equipe adverse', scores[1 - equipeQuiJoue] === '0');

    await wait(6000);
    check('le chrono est gele pendant la pause', sauvegarde().state.timeLeft === chrono);

    // ===== Acces aux parametres sans quitter la partie =====
    check('lien parametres dans le panneau de pause', !!$('btn-pause-settings'));
    $('btn-pause-settings').click();
    check('parametres ouverts depuis la pause', screen() === 'screen-settings');
    $('btn-settings-back').click();
    check('retour sur le jeu en pause', screen() === 'screen-game');
    check('le voile est toujours present', voile() && floute());
    check('le panneau de pause est reaffiche', $('pause-panel').style.display !== 'none');
    check('le chrono n a pas bouge pendant le detour', sauvegarde().state.timeLeft === chrono);

    // ===== Le sas 3 · 2 · 1 =====
    const oscsAvant = oscs;
    $('btn-resume-turn').click();
    check('le decompte demarre a 3', $('pause-countdown').textContent === '3');
    check('le panneau a laisse place au decompte', $('pause-panel').style.display === 'none');
    check('le jeu est toujours floute pendant le decompte', floute());

    await wait(1100);
    check('le decompte passe a 2', $('pause-countdown').textContent === '2');
    await wait(1000);
    check('le decompte passe a 1', $('pause-countdown').textContent === '1');
    check('le chrono n a pas bouge pendant le decompte', parseInt($('timer').textContent, 10) === chrono);

    await wait(1200);
    check('le voile a disparu', !voile());
    check('le jeu n est plus floute', !floute());
    check('meme carte qu avant la pause', $('card-word').textContent === carteAvant);
    check('3 tics joues pendant le decompte', oscs - oscsAvant === 3);

    await wait(2500);
    check('le chrono est bien reparti', parseInt($('timer').textContent, 10) < chrono);

    // ===== Quitter depuis la pause =====
    $('btn-pause').click();
    const chronoQuit = parseInt($('timer').textContent, 10);
    $('btn-quit-game').click();
    check('retour a l accueil', screen() === 'screen-home');
    check('le voile est retire en quittant', !voile());
    check('la partie est conservee', sauvegarde() !== null);
    check('le chrono est fige a la sortie', sauvegarde().state.timeLeft === chronoQuit);
    check('bloc Reprendre propose', $('resume-block').style.display !== 'none');

    // ===== Reprise depuis l'accueil : elle passe aussi par le sas =====
    $('btn-resume').click();
    check('on revient sur l ecran de jeu', screen() === 'screen-game');
    check('le sas se declenche aussi depuis l accueil', $('pause-countdown').textContent === '3');
    check('la carte est floutee pendant le sas', floute());
    await wait(3300);
    check('le jeu repart apres le decompte', !voile() && !floute());
    check('chrono intact apres le detour par l accueil', parseInt($('timer').textContent, 10) === chronoQuit);
    check('meme carte apres le detour', $('card-word').textContent === carteAvant);

    // ===== Le libelle et l'abandon =====
    $('btn-pause').click();
    log('       libelles : "' + $('btn-quit-game').textContent.trim() + '" / "' + $('btn-abandon-game').textContent.trim() + '"');
    check('le bouton quitter est explicite', $('btn-quit-game').textContent.includes('reprendre plus tard'));
    check('l option abandonner est presente', !!$('btn-abandon-game'));
    check('l abandon est discret (btn-link)', $('btn-abandon-game').classList.contains('btn-link'));

    $('btn-abandon-game').click();
    check('une confirmation est demandee', $('dialog-overlay').style.display !== 'none');
    check('elle previent de la perte des scores', $('dialog-message').textContent.includes('perdus'));
    check('l action destructrice est signalee', $('dialog-confirm').classList.contains('btn-danger'));
    check('une sortie de secours est proposee', $('dialog-cancel').style.display !== 'none');

    $('dialog-cancel').click();
    await wait(0);
    check('abandon annule : la boite se referme', $('dialog-overlay').style.display === 'none');
    check('abandon annule : on reste en pause', voile() && sauvegarde() !== null);

    $('btn-abandon-game').click();
    $('dialog-confirm').click();
    await wait(0);
    check('abandon confirme : retour a l accueil', screen() === 'screen-home');
    check('abandon confirme : la partie est effacee', w.localStorage.getItem('timesup_partie_en_cours') === null);
    check('abandon confirme : le bloc Reprendre disparait', $('resume-block').style.display === 'none');
    check('abandon confirme : le voile est retire', !voile());

    log('SCENARIO 9 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
