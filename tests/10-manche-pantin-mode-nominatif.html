<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — manche pantin, mode nominatif</title></head>
<body>
<pre id="log">demarrage...</pre>
<iframe id="f" src="/" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('f').addEventListener('load', async () => {
  const f = document.getElementById('f'), d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const screen = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const pilule = nom => [...d.querySelectorAll('#rounds-optional .round-pill')].find(p => p.textContent.includes(nom));
  const note = () => $('rounds-note');

  function ajouterJoueur(nom) {
    $('player-name-input').value = nom;
    $('btn-add-player').click();
  }

  try {
    await wait(1200);
    $('btn-start').click();
    d.querySelector('[data-source="themes"]').click();
    d.querySelectorAll('#theme-selector .btn-theme')[0].click();
    $('btn-next-step').click();
    // mode nominatif actif par defaut
    ['Ana', 'Bob', 'Cleo', 'Dan'].forEach(ajouterJoueur);
    check('4 joueurs ajoutes', $('player-count').textContent.startsWith('4'));

    // --- Deux joueurs ne peuvent pas porter le meme prenom ---
    ajouterJoueur('ana');
    check('un prenom deja pris n est pas ajoute', $('player-count').textContent.startsWith('4'));
    log('       message : "' + $('player-error').textContent + '"');
    check('un message l explique', $('player-error').textContent.includes('déjà'));
    check('il propose une solution', $('player-error').textContent.includes('initiale'));
    ajouterJoueur('Ana B');
    check('un prenom distinct est accepte', $('player-count').textContent.startsWith('5'));
    check('le message a disparu', $('player-error').textContent === '');
    d.querySelectorAll('#player-list .btn-remove')[4].click();
    check('retour a 4 joueurs', $('player-count').textContent.startsWith('4'));
    $('btn-next-players').click();
    check('etape des manches', screen() === 'screen-rounds');

    // --- 4 joueurs = 2 par equipe : la manche doit etre verrouillee ---
    let pantin = pilule('bouger');
    check('la manche pantin est affichee mais verrouillee', !!pantin && pantin.disabled);
    check('la pose figee reste disponible', !pilule('Pose').disabled);
    check('une explication est affichee', note().style.display !== 'none');
    log('       note : "' + note().textContent + '"');
    check('l explication donne le minimum requis', note().textContent.includes('3 joueurs par équipe'));
    check('l explication donne l effectif actuel', note().textContent.includes('en compte 2'));
    check('aucune question posee en mode nominatif', $('puppet-confirm').style.display === 'none');
    check('Suivant reste actif', !$('btn-next-rounds').disabled);

    // un clic ne doit rien faire
    pantin.click();
    check('la manche verrouillee ne peut pas etre selectionnee', !pilule('bouger').classList.contains('active'));

    // --- On revient ajouter 2 joueurs : 3 par equipe ---
    d.querySelector('#screen-rounds .btn-back').click();
    check('retour a l etape joueurs', screen() === 'screen-players');
    ajouterJoueur('Eve');
    ajouterJoueur('Femi');
    check('6 joueurs', $('player-count').textContent.startsWith('6'));
    $('btn-next-players').click();

    pantin = pilule('bouger');
    check('la manche est debloquee a 3 joueurs par equipe', !pantin.disabled);
    check('plus d explication affichee', note().style.display === 'none');
    pantin.click();
    check('elle peut maintenant etre selectionnee', pilule('bouger').classList.contains('active'));
    check('toujours aucune question en mode nominatif', $('puppet-confirm').style.display === 'none');
    check('Suivant actif', !$('btn-next-rounds').disabled);

    $('btn-next-rounds').click();
    $('btn-play').click();
    $('btn-start-turn').click();
    await wait(500);
    const snap = JSON.parse(w.localStorage.getItem('timesup_partie_en_cours'));
    log('       manches retenues : ' + JSON.stringify(snap.state.activeRounds));
    check('la manche pantin est dans la partie', snap.state.activeRounds.includes(4));

    log('SCENARIO 18 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
