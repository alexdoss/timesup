<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — quota IA et fiche de thème</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

function jourCourant() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Même origine que l'app : on prépare son stockage avant de la charger
localStorage.setItem('timesup_custom_themes', JSON.stringify({
  t1: { id: 't1', name: 'Thème de test', icon: '✨', words: ['alpha', 'beta', 'gamma'] }
}));
localStorage.removeItem('timesup_quota_ia');
localStorage.removeItem('timesup_partie_en_cours');

const f = document.createElement('iframe');
f.src = '/';
f.style.cssText = 'width:420px;height:900px;border:1px solid #ccc';
document.getElementById('hote').appendChild(f);

f.addEventListener('load', async () => {
  const d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const screen = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const cartes = () => [...d.querySelectorAll('#theme-cards-list li .player-name')].map(e => e.textContent);
  const themeStocke = () => JSON.parse(w.localStorage.getItem('timesup_custom_themes')).t1;

  try {
    await wait(1200);

    // ===== QUOTA =====
    $('btn-library').click();
    $('btn-create-theme').click();
    log('       quota : "' + $('ai-quota').textContent + '"');
    check('le quota du jour est annonce', $('ai-quota').textContent.includes('5 génération(s) restante(s)'));
    check('le bouton Generer est actif', !$('btn-generate').disabled);

    w.localStorage.setItem('timesup_quota_ia', JSON.stringify({ jour: jourCourant(), utilise: 2 }));
    $('btn-create-theme').click();
    check('le compteur decompte les generations faites', $('ai-quota').textContent.includes('3 génération(s) restante(s)'));
    check('le bouton reste actif tant qu il reste du quota', !$('btn-generate').disabled);

    w.localStorage.setItem('timesup_quota_ia', JSON.stringify({ jour: jourCourant(), utilise: 5 }));
    $('btn-create-theme').click();
    log('       quota : "' + $('ai-quota').textContent + '"');
    check('la limite atteinte est annoncee', $('ai-quota').textContent.includes('Limite atteinte'));
    check('le bouton Generer est desactive', $('btn-generate').disabled);

    w.localStorage.setItem('timesup_quota_ia', JSON.stringify({ jour: '2020-01-01', utilise: 5 }));
    $('btn-create-theme').click();
    check('un compteur d un autre jour est ignore', $('ai-quota').textContent.includes('5 génération(s) restante(s)'));
    check('le bouton est de nouveau actif', !$('btn-generate').disabled);

    // ===== FICHE DU THEME =====
    d.querySelector('#screen-ai-create .btn-back').click();
    check('retour a la bibliotheque', screen() === 'screen-library');
    const ligne = d.querySelector('.custom-theme-open');
    check('le theme est liste', !!ligne);
    log('       ligne : "' + ligne.textContent + '"');
    check('le nombre de cartes est affiche', ligne.textContent.includes('(3 cartes)'));

    ligne.click();
    check('la fiche du theme s ouvre', screen() === 'screen-theme-edit');
    check('le titre reprend le nom du theme', $('theme-edit-title').textContent.includes('Thème de test'));
    check('les 3 cartes sont listees en clair', JSON.stringify(cartes()) === JSON.stringify(['alpha', 'beta', 'gamma']));
    check('le compteur affiche 3', $('theme-edit-count').textContent.includes('3 carte'));

    // --- Ajout ---
    $('theme-card-input').value = 'delta';
    $('btn-add-theme-card').click();
    check('la carte est ajoutee', cartes().includes('delta'));
    check('le compteur passe a 4', $('theme-edit-count').textContent.includes('4 carte'));
    check('l ajout est enregistre', themeStocke().words.length === 4);
    check('le champ est vide apres ajout', $('theme-card-input').value === '');

    // --- Doublon refuse (meme en changeant la casse) ---
    $('theme-card-input').value = 'DELTA';
    $('btn-add-theme-card').click();
    log('       message : "' + $('theme-edit-error').textContent + '"');
    check('le doublon est refuse', themeStocke().words.length === 4);
    check('un message explique le refus', $('theme-edit-error').textContent.includes('déjà'));

    // --- Trop court ---
    $('theme-card-input').value = 'x';
    $('btn-add-theme-card').click();
    check('une carte d une lettre est refusee', themeStocke().words.length === 4);
    check('un message explique la longueur', $('theme-edit-error').textContent.includes('2 caractères'));

    // --- Suppression ---
    d.querySelectorAll('#theme-cards-list li .btn-remove')[0].click();
    check('la carte est supprimee de la liste', !cartes().includes('alpha'));
    check('la suppression est enregistree', themeStocke().words.length === 3);
    check('le compteur repasse a 3', $('theme-edit-count').textContent.includes('3 carte'));

    // --- Le bouton Terminer sort de la fiche comme la fleche retour ---
    check('un bouton Terminer est propose', !!$('btn-theme-done'));
    $('btn-theme-done').click();
    check('Terminer ramene a la bibliotheque', screen() === 'screen-library');
    check('les cartes sont toujours la apres Terminer', themeStocke().words.length === 3);
    d.querySelector('.custom-theme-open').click();
    check('on peut rouvrir la fiche', screen() === 'screen-theme-edit');

    // --- Retour et repercussion ---
    $('btn-theme-back').click();
    check('retour a la bibliotheque', screen() === 'screen-library');
    check('le compte est a jour dans la liste', d.querySelector('.custom-theme-open').textContent.includes('(3 cartes)'));

    d.querySelector('.btn-close').click();
    $('btn-start').click();
    $('btn-next-mode').click();
    const bouton = [...d.querySelectorAll('#theme-selector .btn-theme')].find(b => b.textContent.includes('Thème de test'));
    check('le theme apparait dans la selection', !!bouton);
    check('avec le nombre de cartes a jour', bouton.textContent.includes('(3)'));

    log('SCENARIO 19 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
