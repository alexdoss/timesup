<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — fonction serveur /api/generate</title></head>
<body>
<pre id="log">demarrage...</pre>
<script type="module">
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }

const URL_KV = 'https://kv.exemple/';
let appelsKV = [];
let compteurKV = 0;
let appelsGroq = 0;
let reponseGroq = { ok: true, texte: '["Un", " Deux ", "", "Trois"]' };
let dernierCorpsGroq = null;

// Faux fetch : intercepte les appels du module serveur
window.__fauxFetch = async (url, options) => {
  if (String(url).startsWith(URL_KV)) {
    const commande = JSON.parse(options.body);
    appelsKV.push(commande);
    if (commande[0] === 'INCR') { compteurKV++; return { ok: true, json: async () => ({ result: compteurKV }) }; }
    return { ok: true, json: async () => ({ result: 'OK' }) };
  }
  appelsGroq++;
  dernierCorpsGroq = JSON.parse(options.body);
  if (!reponseGroq.ok) {
    return { ok: false, status: 500, text: async () => 'boom' };
  }
  return {
    ok: true,
    json: async () => ({ choices: [{ message: { content: reponseGroq.texte } }] })
  };
};

let source = null;
async function charger(env) {
  if (!source) source = await (await fetch('/api/generate.js')).text();
  const shim = `const process = { env: ${JSON.stringify(env)} };\n`
             + `const fetch = (...a) => window.__fauxFetch(...a);\n`;
  const blob = new Blob([shim + source], { type: 'text/javascript' });
  const url = URL.createObjectURL(blob);
  const mod = await import(url);
  URL.revokeObjectURL(url);
  return mod.default;
}

function fauxRes() {
  const r = { code: 0, body: null };
  r.status = c => { r.code = c; return r; };
  r.json = b => { r.body = b; return r; };
  return r;
}

function fauxReq(corps, ip = '10.0.0.1', methode = 'POST') {
  return { method: methode, headers: { 'x-forwarded-for': ip }, body: corps };
}

(async () => {
  try {
    // --- Le fichier est-il seulement valide ? ---
    const handler = await charger({ GROQ_API_KEY: 'cle-test' });
    check('le module serveur se charge sans erreur de syntaxe', typeof handler === 'function');

    // --- Methode refusee ---
    let res = fauxRes();
    await handler(fauxReq({ themeName: 'X', count: 10 }, '10.0.0.1', 'GET'), res);
    check('une requete GET est refusee (405)', res.code === 405);

    // --- Cle API absente ---
    const sansCle = await charger({});
    res = fauxRes();
    await sansCle(fauxReq({ themeName: 'X', count: 10 }), res);
    check('sans cle Groq, erreur 500 explicite', res.code === 500 && res.body.error.includes('API key'));

    // --- Parametres manquants ---
    res = fauxRes();
    await handler(fauxReq({ count: 10 }), res);
    check('sans nom de theme, erreur 400', res.code === 400);

    // --- Cas nominal, sans stockage KV configure ---
    appelsGroq = 0; appelsKV = [];
    res = fauxRes();
    await handler(fauxReq({ themeName: 'Sport', count: 3 }), res);
    check('sans stockage configure, la generation fonctionne', res.code === 200);
    check('aucun appel au compteur quand il n est pas configure', appelsKV.length === 0);
    log('       mots renvoyes : ' + JSON.stringify(res.body.words));
    check('les mots sont nettoyes et les vides ecartes', JSON.stringify(res.body.words) === JSON.stringify(['Un', 'Deux', 'Trois']));

    // --- Le modele, et les precautions propres aux modeles de raisonnement ---
    log('       corps envoye : ' + JSON.stringify({
      model: dernierCorpsGroq.model, reasoning_effort: dernierCorpsGroq.reasoning_effort,
      max_tokens: dernierCorpsGroq.max_tokens }));
    check('le modele par defaut n est plus le llama deprecie',
          !dernierCorpsGroq.model.includes('llama-3.3'));
    check('la reflexion est reduite au minimum',
          dernierCorpsGroq.reasoning_effort === 'low');
    check('le budget de jetons couvre reflexion et reponse',
          dernierCorpsGroq.max_tokens >= 4096);

    // --- La langue suit celle de l app, elle n est pas codee en dur ---
    const envoye = dernierCorpsGroq.messages[0].content;
    check('sans precision, la langue de l app est demandee', envoye.includes('en français'));

    for (const [code, attendu] of [['en', 'anglais'], ['es', 'espagnol'], ['pt-BR', 'portugais']]) {
      res = fauxRes();
      await handler(fauxReq({ themeName: 'Sport', count: 3, langue: code }), res);
      const p = dernierCorpsGroq.messages[0].content;
      check(`la langue « ${code} » est transmise au modele`, p.includes(`en ${attendu}`));
      check(`et le francais n est plus impose pour « ${code} »`, !p.includes('en français'));
    }

    // Une langue inconnue de la table passe par son code : les modeles savent lire
    res = fauxRes();
    await handler(fauxReq({ themeName: 'Sport', count: 3, langue: 'sv' }), res);
    check('une langue non repertoriee passe quand meme',
          dernierCorpsGroq.messages[0].content.includes('en sv'));

    // --- La consigne du joueur vient en dernier, donc elle prime ---
    res = fauxRes();
    await handler(fauxReq({ themeName: 'Sport', count: 3, comment: 'en anglais stp' }), res);
    const avecConsigne = dernierCorpsGroq.messages[0].content;
    check('la consigne du joueur est placee apres les regles',
          avecConsigne.indexOf('en anglais stp') > avecConsigne.indexOf('Règles à respecter'));
    check('et elle est annoncee comme prioritaire',
          avecConsigne.includes('prioritaire'));

    // --- Le modele se change depuis Vercel, sans redeployer ---
    const autreModele = await charger({ GROQ_API_KEY: 'cle-test', GROQ_MODELE: 'qwen/qwen3.6-27b' });
    res = fauxRes();
    await autreModele(fauxReq({ themeName: 'Sport', count: 3 }), res);
    check('la variable d environnement impose le modele',
          dernierCorpsGroq.model === 'qwen/qwen3.6-27b');
    check('et le parametre de raisonnement n est pas envoye a un modele qui l ignore',
          dernierCorpsGroq.reasoning_effort === undefined);
    check('la generation fonctionne quand meme', res.code === 200);

    // --- Ce que renvoie un modele n est pas un contrat : trois pieges ---
    const piegeux = [
      ['une reflexion qui fuit dans la reponse',
       '<think>Je vais lister des sports [en francais]</think>\n["Tennis", "Judo"]', ['Tennis', 'Judo']],
      ['une cloture markdown autour du JSON',
       '```json\n["Tennis", "Judo"]\n```', ['Tennis', 'Judo']],
      ['des valeurs qui ne sont pas des chaines',
       '["Tennis", 42, null, "Judo"]', ['Tennis', 'Judo']]
    ];
    for (const [nom, texte, attendu] of piegeux) {
      reponseGroq = { ok: true, texte };
      res = fauxRes();
      await handler(fauxReq({ themeName: 'Sport', count: 2 }), res);
      check(nom + ' est surmontee',
            res.code === 200 && JSON.stringify(res.body.words) === JSON.stringify(attendu));
    }

    reponseGroq = { ok: true, texte: "Desole, je ne peux pas repondre." };
    res = fauxRes();
    await handler(fauxReq({ themeName: 'Sport', count: 2 }), res);
    check('une reponse sans liste renvoie une erreur claire',
          res.code === 502 && res.body.error.includes('format'));

    reponseGroq = { ok: true, texte: '["Un", " Deux ", "", "Trois"]' };

    // --- Avec stockage KV : le plafond par IP s applique ---
    const avecKV = await charger({ GROQ_API_KEY: 'cle-test', KV_REST_API_URL: URL_KV, KV_REST_API_TOKEN: 'jeton' });
    compteurKV = 0; appelsKV = []; appelsGroq = 0;

    res = fauxRes();
    await avecKV(fauxReq({ themeName: 'Sport', count: 3 }), res);
    check('premiere generation acceptee', res.code === 200);
    check('le compteur est incremente', appelsKV.some(c => c[0] === 'INCR'));
    check('une expiration est posee au premier appel', appelsKV.some(c => c[0] === 'EXPIRE'));

    // on pousse jusqu'au plafond de 20
    for (let i = 2; i <= 20; i++) { res = fauxRes(); await avecKV(fauxReq({ themeName: 'Sport', count: 3 }), res); }
    check('la 20e generation passe encore', res.code === 200);

    const groqAvant = appelsGroq;
    res = fauxRes();
    await avecKV(fauxReq({ themeName: 'Sport', count: 3 }), res);
    log('       reponse 21e : ' + res.code + ' — ' + (res.body.error || ''));
    check('la 21e est refusee (429)', res.code === 429);
    check('le message est en francais et comprehensible', res.body.error.includes('Trop de générations'));
    check('aucun appel a l IA quand le plafond est atteint', appelsGroq === groqAvant);

    // --- Le compteur en panne ne doit pas casser la generation ---
    const sauvegarde = window.__fauxFetch;
    window.__fauxFetch = async (url, options) => {
      if (String(url).startsWith(URL_KV)) throw new Error('service indisponible');
      return sauvegarde(url, options);
    };
    res = fauxRes();
    await avecKV(fauxReq({ themeName: 'Sport', count: 3 }), res);
    check('compteur en panne : la generation passe quand meme', res.code === 200);
    window.__fauxFetch = sauvegarde;

    // --- Erreur Groq remontee proprement ---
    reponseGroq = { ok: false };
    res = fauxRes();
    await handler(fauxReq({ themeName: 'Sport', count: 3 }), res);
    check('une panne de Groq renvoie 502', res.code === 502);

    log('SCENARIO 20 TERMINE');
  } catch (e) {
    log('EXCEPTION: ' + e.message + '\n' + e.stack);
  }
})();
</script>
</body>
</html>
