<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — regles du jeu</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script type="module">
import { ROUNDS } from '/js/game.js';

const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

try {
  localStorage.removeItem('timesup_partie_en_cours');

  const f = document.createElement('iframe');
  f.style.cssText = 'width:420px;height:900px;border:1px solid #ccc';
  const charge = new Promise(r => f.addEventListener('load', r));
  f.src = '/';
  document.getElementById('hote').appendChild(f);
  await charge;

  const d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;

  await wait(1200);

  // --- Place dans le menu d'accueil ---
  check('le menu propose les regles du jeu', !!$('btn-rules'));
  check('le libelle est explicite', $('btn-rules').textContent.includes('Règles du jeu'));
  const menu = [...$('screen-home').querySelectorAll('.btn')].map(b => b.id);
  check('les regles sont placees sous la bibliotheque',
        menu.indexOf('btn-rules') === menu.indexOf('btn-library') + 1);

  // --- Ouverture ---
  $('btn-rules').click();
  check('la page des regles s ouvre', ecran() === 'screen-rules');

  const titres = [...d.querySelectorAll('#screen-rules .rules h3')].map(h => h.textContent);
  log('       sections : ' + titres.join(' / '));
  check('les 6 sections sont presentes', titres.length === 6);
  ['Objectif', 'Déroulement d\'un tour', 'Les manches', 'Passer une carte', 'Score', 'Plusieurs parties de suite']
    .forEach(t => check('section « ' + t + ' »', titres.includes(t)));

  // --- Les manches viennent du moteur : aucune desynchronisation possible ---
  const items = [...d.querySelectorAll('#rules-rounds li')];
  check('toutes les manches du jeu sont listees', items.length === ROUNDS.length);
  const conformes = ROUNDS.every((round, i) =>
    items[i] &&
    items[i].querySelector('strong').textContent === `${round.icon} ${round.name}` &&
    items[i].textContent.includes(round.desc));
  check('chaque manche affiche son nom et sa regle exacte', conformes);
  check('la manche pantin y figure', items.some(li => li.textContent.includes('Faire bouger un partenaire')));

  const note = d.querySelector('#screen-rules .rules-note');
  check('les manches optionnelles sont signalees', !!note && note.textContent.includes('optionnelles'));

  // --- Aucune fuite de balises depuis les textes ---
  check('les regles sont affichees en texte, pas en HTML',
        !d.querySelector('#rules-rounds').innerHTML.includes('&lt;script'));

  // --- Sortie ---
  d.querySelector('#screen-rules .btn-close').click();
  check('la croix ramene a l accueil', ecran() === 'screen-home');
  $('btn-rules').click();
  check('la page se rouvre sans probleme', ecran() === 'screen-rules');
  check('la liste n est pas dupliquee a la reouverture',
        d.querySelectorAll('#rules-rounds li').length === ROUNDS.length);

  log('SCENARIO 14 TERMINE');
} catch (e) {
  log('EXCEPTION: ' + e.message + '\n' + e.stack);
}
</script>
</body>
</html>
