<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — scores manche / partie / soiree</title></head>
<body>
<pre id="log">demarrage...</pre>
<iframe id="f" src="/" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('f').addEventListener('load', async () => {
  const f = document.getElementById('f'), d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const sauvegarde = () => JSON.parse(w.localStorage.getItem('timesup_partie_en_cours') || 'null');

  const val = id => parseInt($(id).textContent, 10);

  // Le tableau de fin de manche porte desormais une ligne par manche jouee :
  // la manche qui vient de s achever est la seule marquee « en cours ».
  const lignesManches = () =>
    [...d.querySelectorAll('#end-scores .manche-passee, #end-scores .manche-en-cours')];
  const scoreManche = e =>
    parseInt(d.querySelector('#end-scores .manche-en-cours').children[e + 1].textContent, 10);
  const scorePartie = e => val(`end-team${e + 1}-score`);
  const sommeDesManches = e =>
    lignesManches().reduce((t, tr) => t + parseInt(tr.children[e + 1].textContent, 10), 0);

  // La rotation continue par-dessus les manches : chaque manche est ouverte par
  // l'equipe suivante. On lit donc qui joue, au lieu de le supposer.
  const equipeQuiJoue = () => sauvegarde().state.currentTeam;

  // Vide le paquet d'une traite : un seul tour suffit quand on ne perd pas de temps
  async function jouerLaManche() {
    $('btn-start-turn').click();
    let clics = 0;
    while (ecran() === 'screen-game' && clics < 300) { $('btn-found').click(); clics++; }
    $('btn-next-turn').click();
  }

  try {
    w.localStorage.removeItem('timesup_partie_en_cours');
    await wait(1200);

    // ===== PARTIE 1 =====
    $('btn-start').click();
    d.querySelector('[data-source="themes"]').click();
    d.querySelectorAll('#theme-selector .btn-theme')[0].click();
    $('btn-next-step').click();
    d.querySelector('[data-mode="simple"]').click();
    $('btn-repartition-jouer').click();
    $('btn-next-rounds').click();
    $('btn-play').click();
    // Parties a themes : l app propose de partager le suivi avant de lancer
    $('dialog-cancel').click();
    await wait(0);
    const total1 = [0, 0];

    // --- Manche 1 ---
    const ouvre1 = equipeQuiJoue();
    check('la partie s ouvre sur l equipe tiree au sort', ouvre1 === sauvegarde().state.startingTeam);
    await jouerLaManche();
    check('fin de la manche 1', ecran() === 'screen-round-end');
    const paquet = scoreManche(ouvre1);
    total1[ouvre1] += paquet;
    log('       cartes du paquet : ' + paquet + ', manche 1 ouverte par l equipe ' + (ouvre1 + 1));
    check('la manche 1 a bien ete jouee', paquet > 0);
    check('le total de la partie vaut la manche', scorePartie(ouvre1) === paquet);
    check('l equipe adverse est a zero',
          scoreManche(1 - ouvre1) === 0 && scorePartie(1 - ouvre1) === 0);
    check('le titre nomme la manche', $('round-end-title').textContent.includes('1/3'));
    check('une seule ligne de manche apres la manche 1', lignesManches().length === 1);
    check('elle est nommee, pas numerotee',
          lignesManches()[0].querySelector('th').textContent.includes('Description'));

    // --- Manche 2 : c'est a l'autre equipe d'ouvrir ---
    $('btn-next-round').click();
    check('le lancement de tour repart de zero sur la manche',
          $('round-team1-score').textContent === '0' && $('round-team2-score').textContent === '0');
    const rappel = $('round-total').textContent.match(/(\d+)\D+(\d+)/);
    log('       rappel du total : "' + $('round-total').textContent + '"');
    check('mais rappelle le total de la partie',
          parseInt(rappel[1], 10) === total1[0] && parseInt(rappel[2], 10) === total1[1]);
    const ouvre2 = equipeQuiJoue();
    check('la manche 2 est ouverte par l autre equipe', ouvre2 === 1 - ouvre1);
    await jouerLaManche();
    total1[ouvre2] += paquet;
    check('fin de la manche 2', ecran() === 'screen-round-end');
    check('la manche 2 compte ses propres points', scoreManche(ouvre2) === paquet);
    check('celle qui n a pas joue reste a zero sur la manche', scoreManche(1 - ouvre2) === 0);
    check('les totaux de partie cumulent les deux manches',
          scorePartie(0) === total1[0] && scorePartie(1) === total1[1]);
    check('manche et total sont bien distincts pour l equipe 1',
          scoreManche(ouvre1) !== scorePartie(ouvre1));
    check('les deux manches sont listees', lignesManches().length === 2);
    check('une seule manche est mise en evidence',
          d.querySelectorAll('#end-scores .manche-en-cours').length === 1);
    check('la precedente est passee en retrait',
          lignesManches()[0].classList.contains('manche-passee'));

    // --- Manche 3 : la rotation ramene la premiere equipe ---
    $('btn-next-round').click();
    const ouvre3 = equipeQuiJoue();
    check('la manche 3 revient a l equipe qui a ouvert la partie', ouvre3 === ouvre1);
    await jouerLaManche();
    total1[ouvre3] += paquet;
    check('fin de la manche 3', ecran() === 'screen-round-end');
    check('les totaux atteignent trois manches',
          scorePartie(0) === total1[0] && scorePartie(1) === total1[1]);
    check('le paquet complet a ete distribue', total1[0] + total1[1] === paquet * 3);
    check('personne n a ouvert les trois manches', total1[0] > 0 && total1[1] > 0);
    check('les trois manches sont detaillees', lignesManches().length === 3);
    check('leur somme vaut exactement le total',
          sommeDesManches(0) === scorePartie(0) && sommeDesManches(1) === scorePartie(1));
    log('       lignes : ' + lignesManches().map(tr =>
      tr.querySelector('th').textContent + ' ' +
      tr.children[1].textContent + '/' + tr.children[2].textContent).join('  |  '));

    // ===== FIN DE LA PREMIERE PARTIE =====
    $('btn-next-round').click();
    check('ecran de fin de partie', ecran() === 'screen-final');
    check('le score de la partie est reporte',
          val('final-team1-score') === total1[0] && val('final-team2-score') === total1[1]);
    check('aucun cumul de soiree a la premiere partie', $('session-row').style.display === 'none');
    check('la fin de partie detaille aussi les trois manches',
          d.querySelectorAll('#final-scores .manche-passee').length === 3);
    check('aucun tableau de joueurs en mode simple', $('player-stats').children.length === 0);
    check('un vainqueur est annonce', $('winner').textContent.includes('gagne'));
    check('on peut rejouer avec les memes joueurs', !!$('btn-replay'));
    check('on peut aussi repartir de zero', !!$('btn-restart'));

    // ===== PARTIE 2, MEMES JOUEURS =====
    // Rejouer repasse par le choix du thème : le paquet peut changer, les
    // équipes et les manches non. Le thème précédent reste coché.
    $('btn-replay').click();
    check('on revient choisir le paquet', ecran() === 'screen-themes');
    check('le theme precedent est toujours coche',
          d.querySelectorAll('#theme-selector .btn-theme.active').length > 0);
    check('le bouton lance la partie', $('btn-next-step').textContent.includes("C'est parti"));
    check('et il est deja actif, puisqu un theme est choisi', !$('btn-next-step').disabled);
    $('btn-next-step').click();
    check('la partie suivante demarre', ecran() === 'screen-round');
    const etat = sauvegarde().state;
    check('les scores de partie repartent a zero', etat.teams[0].score === 0 && etat.teams[1].score === 0);
    check('la partie precedente est mise de cote',
          etat.sessionScores[0] === total1[0] && etat.sessionScores[1] === total1[1]);
    check('une partie est comptabilisee', etat.gamesPlayed === 1);
    check('on repart bien de la manche 1', etat.currentRound === 0);

    // ===== PARTIE 2 : meme mecanique, nouveau tirage =====
    const total2 = [0, 0];
    let ouvre = equipeQuiJoue();
    await jouerLaManche();
    total2[ouvre] += paquet;
    check('la manche 1 de la partie 2 est isolee', scoreManche(ouvre) === paquet);
    check('le total de la partie 2 ne reprend pas la partie 1', scorePartie(ouvre) === paquet);

    for (const numero of [2, 3]) {
      $('btn-next-round').click();
      ouvre = equipeQuiJoue();
      await jouerLaManche();
      total2[ouvre] += paquet;
    }
    $('btn-next-round').click();
    check('fin de la deuxieme partie', ecran() === 'screen-final');

    // ===== CUMUL DE SOIREE =====
    check('le cumul de soiree apparait', $('session-row').style.display !== 'none');
    log('       libelle : "' + $('session-label').textContent + '"');
    check('il annonce le nombre de parties', $('session-label').textContent.includes('2 parties'));
    check('sans supposer qu on joue le soir',
          !$('session-label').textContent.toLowerCase().includes('soir'));
    check('le score de la partie en cours reste celui de la partie 2',
          val('final-team1-score') === total2[0] && val('final-team2-score') === total2[1]);

    log('       partie 1 : ' + total1.join('/') + '   partie 2 : ' + total2.join('/'));
    check('le cumul additionne les deux parties',
          val('session-team1-score') === total1[0] + total2[0]
          && val('session-team2-score') === total1[1] + total2[1]);
    check('le total de la soiree vaut bien six manches',
          val('session-team1-score') + val('session-team2-score') === paquet * 6);
    check('cumul et partie en cours sont bien distincts',
          val('session-team1-score') !== val('final-team1-score')
          || val('session-team2-score') !== val('final-team2-score'));

    // ===== NOUVELLE PARTIE : LE CUMUL S ARRETE =====
    $('btn-restart').click();
    check('retour a l accueil', ecran() === 'screen-home');

    log('SCENARIO 16 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
