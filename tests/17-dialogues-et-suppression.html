<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — dialogues maison et suppression de theme</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

localStorage.setItem('timesup_custom_themes', JSON.stringify({
  t1: { id: 't1', name: 'Souvenirs de vacances', icon: '✨', words: ['Plage', 'Valise', 'Parasol'] },
  t2: { id: 't2', name: 'Bureau', icon: '✍️', words: ['Agrafeuse', 'Machine à café'] }
}));
localStorage.removeItem('timesup_partie_en_cours');

const f = document.createElement('iframe');
f.src = '/';
f.style.cssText = 'width:420px;height:900px;border:1px solid #ccc';
document.getElementById('hote').appendChild(f);

// Le scenario recharge l'app a la fin : sans ce verrou, ce rechargement
// declencherait une seconde execution complete du scenario.
let demarre = false;

f.addEventListener('load', async () => {
  if (demarre) return;
  demarre = true;

  const d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const ouverte = () => $('dialog-overlay').style.display !== 'none';
  const themes = () => JSON.parse(w.localStorage.getItem('timesup_custom_themes') || '{}');
  const lignes = () => [...d.querySelectorAll('.custom-theme-open')].map(e => e.textContent);
  const boutonTheme = nom => [...d.querySelectorAll('#theme-selector .btn-theme')].find(b => b.textContent.includes(nom));

  // Aucun dialogue du navigateur ne doit plus apparaitre
  let natifs = 0;
  w.alert = () => { natifs++; };
  w.confirm = () => { natifs++; return true; };

  try {
    await wait(1200);

    // ===== VALIDATION : plus aucun alert() du navigateur =====
    $('btn-start').click();
    $('btn-next-mode').click();
    $('btn-next-step').click();   // aucun theme coche
    check('on reste sur l etape des themes', ecran() === 'screen-themes');
    check('une boite maison explique le blocage', ouverte());
    check('aucun dialogue du navigateur n est utilise', natifs === 0);
    log('       titre : "' + $('dialog-title').textContent + '"');
    check('le titre nomme le probleme', $('dialog-title').textContent.includes('Aucun thème'));
    check('le message dit quoi faire', $('dialog-message').textContent.includes('au moins un thème'));
    check('un simple avertissement n a pas de bouton Annuler', $('dialog-cancel').style.display === 'none');
    check('il n est pas presente comme destructeur', !$('dialog-confirm').classList.contains('btn-danger'));

    // fermeture au clavier
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await wait(0);
    check('la touche Echap referme la boite', !ouverte());

    // ===== LE THEME EST BIEN PROPOSE, ET SELECTIONNE =====
    check('le theme perso est proposable', !!boutonTheme('Souvenirs de vacances'));
    boutonTheme('Souvenirs de vacances').click();
    boutonTheme('Bureau').click();
    check('les deux themes perso sont coches',
          boutonTheme('Souvenirs de vacances').classList.contains('active')
          && boutonTheme('Bureau').classList.contains('active'));

    d.querySelector('#screen-themes .btn-close').click();
    check('retour a l accueil', ecran() === 'screen-home');

    // ===== SUPPRESSION : ANNULER NE SUPPRIME RIEN =====
    $('btn-library').click();
    check('la bibliotheque liste les deux themes', lignes().length === 2);
    const supprimer = () => d.querySelector('#custom-themes-list .btn-delete-theme');
    supprimer().click();
    check('une confirmation est demandee', ouverte());
    log('       titre : "' + $('dialog-title').textContent + '"');
    check('le theme concerne est nomme', $('dialog-title').textContent.includes('Souvenirs de vacances'));
    check('le nombre de cartes perdues est annonce', $('dialog-message').textContent.includes('3 carte'));
    check('l irreversibilite est dite', $('dialog-message').textContent.includes('irréversible'));
    check('la suppression est signalee en rouge', $('dialog-confirm').classList.contains('btn-danger'));
    check('on peut renoncer', $('dialog-cancel').style.display !== 'none');

    $('dialog-cancel').click();
    await wait(0);
    check('renoncer ne supprime rien', !!themes().t1);
    check('le theme est toujours liste', lignes().length === 2);

    // un clic a cote vaut aussi renoncement
    supprimer().click();
    $('dialog-overlay').click();
    await wait(0);
    check('un clic hors de la boite annule aussi', !ouverte() && !!themes().t1);

    // ===== SUPPRESSION CONFIRMEE =====
    supprimer().click();
    $('dialog-confirm').click();
    await wait(0);
    check('le theme est efface du stockage', !themes().t1);
    check('l autre theme est intact', !!themes().t2 && themes().t2.words.length === 2);
    check('il disparait de la bibliotheque', lignes().length === 1);
    check('c est bien l autre qui reste', lignes()[0].includes('Bureau'));
    check('aucun dialogue du navigateur sur tout le parcours', natifs === 0);

    // ===== IL DISPARAIT AUSSI DE LA SELECTION DE PARTIE =====
    d.querySelector('#screen-library .btn-close').click();
    $('btn-start').click();
    $('btn-next-mode').click();
    check('le theme supprime n est plus proposable', !boutonTheme('Souvenirs de vacances'));
    check('il ne compte plus dans la selection', !!boutonTheme('Bureau') && boutonTheme('Bureau').classList.contains('active'));
    $('btn-next-step').click();
    check('la partie peut demarrer avec le theme restant', ecran() === 'screen-players');

    // ===== LA SUPPRESSION SURVIT AU RECHARGEMENT =====
    const rechargee = new Promise(r => f.addEventListener('load', r, { once: true }));
    f.contentWindow.location.reload();
    await rechargee;
    await wait(1200);
    const d2 = f.contentDocument;
    d2.getElementById('btn-library').click();
    const restants = [...d2.querySelectorAll('.custom-theme-open')].map(e => e.textContent);
    check('apres rechargement, le theme reste supprime', restants.length === 1);
    check('et c est toujours le bon qui subsiste', restants[0].includes('Bureau'));

    log('SCENARIO 17 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
