<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — session partagée, côté organisateur</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

// Le driver joue le role des invites, en parlant directement au serveur
async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

localStorage.removeItem('timesup_partie_en_cours');

const f = document.createElement('iframe');
f.src = '/';
f.style.cssText = 'width:420px;height:1100px;border:1px solid #ccc';
document.getElementById('hote').appendChild(f);

let demarre = false;
f.addEventListener('load', async () => {
  if (demarre) return;
  demarre = true;

  const d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const connectes = () => [...d.querySelectorAll('#session-joueurs .connecte')].map(e => e.textContent);
  const visible = id => $(id).style.display !== 'none';

  try {
    await wait(1200);

    // ===== Les cartes perso menent directement au QR, sans choix intermediaire =====
    $('btn-start').click();
    check('etape du type de partie', ecran() === 'screen-mode');
    check('aucun choix de mode de saisie n est propose', d.querySelectorAll('[data-saisie]').length === 0);

    d.querySelector('[data-source="custom"]').click();
    check('la description annonce le QR code',
          d.querySelector('[data-source="custom"]').textContent.includes('QR'));

    $('btn-next-mode').click();

    // ===== La composition du paquet, avant l ouverture =====
    check('un reglage precede l ouverture', ecran() === 'screen-session-ouvrir');

    // La fleche doit ramener a l ecran reellement precedent
    d.querySelector('#screen-session-ouvrir .btn-back').click();
    check('retour depuis le paquet : on retrouve le type de partie', ecran() === 'screen-mode');
    $('btn-next-mode').click();
    check('et on revient au paquet', ecran() === 'screen-session-ouvrir');
    check('le nombre de joueurs est demande', $('session-joueurs-valeur').textContent === '6');
    check('le nombre de cartes par joueur aussi', $('session-cartes-valeur').textContent === '5');
    log('       paquet : ' + $('session-cartes-estimation').textContent);
    check('seul le total du paquet est affiche',
          $('session-cartes-estimation').textContent === '30 cartes dans le paquet');
    check('l ouverture est toujours possible', !$('btn-ouvrir-session').disabled);

    // --- Le minimum est applique, pas signale ---
    check('a 6 joueurs, on ne peut pas descendre sous 5 cartes', $('btn-cartes-moins').disabled);
    check('on ne peut pas descendre sous 4 joueurs non plus', !$('btn-joueurs-moins').disabled);

    // --- Plus de joueurs, donc moins de cartes chacun ---
    for (let i = 0; i < 4; i++) $('btn-joueurs-plus').click();
    check('10 joueurs', $('session-joueurs-valeur').textContent === '10');
    check('le minimum par joueur descend a 3', !$('btn-cartes-moins').disabled);
    $('btn-cartes-moins').click();
    $('btn-cartes-moins').click();
    check('3 cartes par joueur', $('session-cartes-valeur').textContent === '3');
    check('le bouton se bloque au minimum', $('btn-cartes-moins').disabled);
    check('le paquet fait toujours 30 cartes',
          $('session-cartes-estimation').textContent === '30 cartes dans le paquet');

    // --- Revenir a moins de joueurs releve les cartes d office ---
    $('btn-joueurs-moins').click();
    check('a 9 joueurs, les cartes passent a 4 toutes seules',
          $('session-cartes-valeur').textContent === '4');
    check('le paquet reste au-dessus du minimum',
          parseInt($('session-cartes-estimation').textContent, 10) >= 30);
    $('btn-joueurs-plus').click();
    $('btn-cartes-moins').click();
    check('on revient a 10 joueurs et 3 cartes',
          $('session-joueurs-valeur').textContent === '10' && $('session-cartes-valeur').textContent === '3');

    $('btn-ouvrir-session').click();
    await wait(900);
    check('l ecran de session s ouvre aussitot', ecran() === 'screen-session');
    check('aucune fleche de retour : la session est ouverte',
          !d.querySelector('#screen-session .btn-back'));
    check('mais on peut toujours quitter', !!d.querySelector('#screen-session .btn-close'));
    check('la suite est bloquee tant que personne n a saisi', $('btn-session-lancer').disabled);
    check('le bouton dit qu on attend les joueurs',
          $('btn-session-lancer').textContent.includes('attente'));

    const code = $('session-code').textContent.trim();
    log('       code de la partie : ' + code);
    check('un code a 4 caracteres est affiche', code.length === 4);
    check('un QR code est dessine', !!d.querySelector('#session-qr svg'));
    check('le QR encode bien un lien de participation',
          d.querySelector('#session-qr svg').getAttribute('aria-label').includes('rejoindre'));
    check('l adresse lisible est donnee', $('session-adresse').textContent.includes('/rejoindre'));

    // ===== Le lien est cliquable et partageable =====
    check('l adresse est un vrai lien', $('session-adresse').tagName === 'A');
    check('il mene bien a la partie',
          $('session-adresse').href.includes('/rejoindre.html?c=' + code));
    check('il s ouvre dans un autre onglet', $('session-adresse').target === '_blank');

    check('un bouton de partage est propose', !!$('btn-partager'));
    let partage = null;
    w.navigator.share = async donnees => { partage = donnees; };
    $('btn-partager').click();
    await wait(200);
    log('       partage : ' + JSON.stringify(partage));
    check('le partage natif est utilise quand il existe', !!partage);
    check('il transmet le lien de la partie', partage.url.includes('c=' + code));
    check('le message rappelle le code', partage.text.includes(code));
    check('et nomme le jeu', partage.title === 'Rush');

    // Sans partage natif, on retombe sur le presse-papier
    let copie = null;
    delete w.navigator.share;
    Object.defineProperty(w.navigator, 'clipboard', {
      value: { writeText: async t => { copie = t; } }, configurable: true
    });
    $('btn-partager').click();
    await wait(300);
    check('sans partage natif, le lien est copie', !!copie && copie.includes(code));
    check('l utilisateur en est informe', $('dialog-title').textContent.includes('copié'));
    $('dialog-confirm').click();
    await wait(100);
    check('le nombre de cartes est rappele', $('session-rappel').textContent.includes('3 cartes'));
    check('personne n a encore rejoint', connectes()[0].includes('Personne'));

    // ===== Un invite saisit PENDANT que l organisateur configure =====
    let r = await api('rejoindre', { code, prenom: 'Marc' });
    const idMarc = r.corps.idJoueur;
    await api('deposer', { code, idJoueur: idMarc, cartes: ['Plage', 'Valise'], fini: false });

    await wait(2600);
    check('la configuration reste bloquee pendant que Marc saisit', $('btn-session-lancer').disabled);
    check('le reglage de cartes a bien ete conserve', $('session-rappel').textContent.includes('3 cartes'));

    await wait(2600);   // le suivi interroge le serveur toutes les 2 s
    log('       liste : ' + JSON.stringify(connectes()));
    check('Marc apparait tout seul dans la liste', connectes().some(t => t.includes('Marc')));
    check('sa progression est affichee', connectes().some(t => t.includes('2/3')));
    check('le lancement reste bloque', $('btn-session-lancer').disabled);
    check('le bouton nomme celui qu on attend', $('btn-session-lancer').textContent.includes('Marc'));
    check('un moyen de le retirer est propose', !!d.querySelector('#session-joueurs .retirer-joueur'));

    await api('deposer', { code, idJoueur: idMarc, cartes: ['Plage', 'Valise', 'Parasol'], fini: true });
    await wait(2600);
    check('Marc est marque comme pret', connectes().some(t => t.includes('3 cartes ✓')));
    check('la suite devient possible', !$('btn-session-lancer').disabled);
    check('le bouton propose de configurer', $('btn-session-lancer').textContent.includes('configuration'));

    // ===== Les cartes de l organisateur =====
    check('un acces a ses propres cartes est propose', !!$('btn-mes-cartes'));
    $('btn-mes-cartes').click();
    await wait(200);
    check('l ecran de saisie s ouvre', ecran() === 'screen-saisie-locale');
    check('ses cartes s affichent en clair', $('saisie-carte').type === 'text');
    check('aucun prenom demande en mode simple', !visible('saisie-bloc-prenom'));
    check('terminer est bloque tant que le compte n y est pas', $('btn-saisie-fini').disabled);

    for (const mot of ['Alpha', 'Beta', 'Gamma']) {
      $('saisie-carte').value = mot;
      $('btn-saisie-ajouter').click();
    }
    const miennes = [...d.querySelectorAll('#saisie-liste .player-name')].map(e => e.textContent);
    check('les 3 cartes sont saisies', JSON.stringify(miennes) === JSON.stringify(['Alpha', 'Beta', 'Gamma']));
    check('terminer devient possible', !$('btn-saisie-fini').disabled);

    $('btn-saisie-fini').click();
    await wait(800);
    check('on revient a la session', ecran() === 'screen-session');
    check('le bouton indique que c est fait', $('btn-mes-cartes').textContent.includes('✓'));
    check('l organisateur figure dans la liste', connectes().some(t => t.includes('toi')));

    // ===== Le joueur sans telephone =====
    $('btn-session-sanstel').click();
    await wait(200);
    check('l ecran de saisie s ouvre aussi pour lui', ecran() === 'screen-saisie-locale');
    check('son prenom est demande', visible('saisie-bloc-prenom'));
    check('ses cartes sont masquees', $('saisie-carte').type === 'password');
    check('un bouton permet de les devoiler', visible('btn-saisie-visibilite'));

    for (const mot of ['Zeta', 'Eta', 'Theta']) {
      $('saisie-carte').value = mot;
      $('btn-saisie-ajouter').click();
    }
    const masquees = [...d.querySelectorAll('#saisie-liste .player-name')].map(e => e.textContent);
    check('la liste ne devoile pas les mots', masquees.every(t => /^•+$/.test(t)));

    $('btn-saisie-fini').click();
    await wait(300);
    check('sans prenom, la saisie ne se termine pas', ecran() === 'screen-saisie-locale');
    check('un message le demande', $('saisie-erreur').textContent.includes('prénom'));

    $('saisie-prenom').value = 'Jo';
    $('btn-saisie-fini').click();
    await wait(800);
    check('avec un prenom, la saisie est envoyee', ecran() === 'screen-session');
    check('Jo est signale comme sans telephone', connectes().some(t => t.includes('sans téléphone')));

    // ===== Lancement =====
    r = await api('etat', { code });
    check('trois joueurs ont saisi', r.corps.joueurs.length === 3);
    check('le paquet compte 9 cartes', r.corps.total === 9);

    // ===== Un paquet trop maigre est signale AVANT la fermeture =====
    $('btn-session-lancer').click();
    await wait(500);
    log('       alerte : "' + $('dialog-title').textContent + ' — ' + $('dialog-message').textContent + '"');
    check('le paquet trop court est signale', $('dialog-overlay').style.display !== 'none');
    check('le titre chiffre le paquet', $('dialog-title').textContent.includes('9 cartes'));
    check('le message compare aux joueurs attendus', $('dialog-message').textContent.includes('10 joueurs'));
    check('il dit combien manquent', $('dialog-message').textContent.includes('3 ont saisi'));
    check('on peut attendre les autres', $('dialog-cancel').textContent.includes('Attendre'));

    $('dialog-cancel').click();
    await wait(300);
    check('renoncer laisse sur la session', ecran() === 'screen-session');
    r = await api('etat', { code });
    check('et surtout ne ferme pas la session', r.corps.ouverte === true);

    // ===== On passe outre =====
    $('btn-session-lancer').click();
    await wait(500);
    $('dialog-confirm').click();
    await wait(900);
    check('la configuration reprend par les equipes', ecran() === 'screen-players');

    r = await api('etat', { code });
    check('la saisie est close, plus personne ne peut rejoindre', r.corps.ouverte === false);

    check('la liste des joueurs reste masquee', !visible('nominatif-block'));
    check('une note recapitule qui a saisi', visible('note-joueurs-partages'));
    log('       note : "' + $('note-joueurs-partages').textContent.trim() + '"');
    check('elle nomme les joueurs', $('note-joueurs-partages').textContent.includes('Marc'));
    check('elle annonce la repartition a venir',
          $('note-joueurs-partages').textContent.includes('équipes'));
    check('le retour arriere est retire, la session etant close',
          d.querySelector('#screen-players .btn-back').style.display === 'none');

    // ===== A 3 joueurs, le mode nominatif est refuse =====
    check('le mode nominatif est propose par defaut',
          d.querySelector('[data-mode="nominatif"]').classList.contains('active'));
    $('btn-next-players').click();
    await wait(300);
    log('       message : "' + $('dialog-message').textContent + '"');
    check('a 3 joueurs, jouer avec les noms est refuse', $('dialog-overlay').style.display !== 'none');
    check('le message dit combien ont saisi', $('dialog-message').textContent.includes('3 ont saisi'));
    check('il oriente vers le mode simple', $('dialog-message').textContent.includes('Simple'));
    $('dialog-confirm').click();
    await wait(200);
    check('on reste sur l etape des equipes', ecran() === 'screen-players');

    d.querySelector('[data-mode="simple"]').click();
    $('btn-next-players').click();
    check('en mode simple, on enchaine sur les manches', ecran() === 'screen-rounds');

    check('l app connait maintenant l effectif : aucune question posee',
          $('puppet-confirm').style.display === 'none');
    const pantin = [...d.querySelectorAll('#rounds-optional .round-pill')].find(p => p.textContent.includes('bouger'));
    check('a 3 joueurs, la manche pantin est verrouillee', pantin.disabled);
    check('une explication est donnee', $('rounds-note').style.display !== 'none');

    $('btn-next-rounds').click();
    check('puis le deroulement', ecran() === 'screen-config');
    check('le reglage des cartes n y est plus, il a deja ete fait',
          $('cards-count-field').style.display === 'none');

    $('btn-play').click();
    await wait(900);
    check('la partie demarre', ecran() === 'screen-round');

    const sauvegarde = JSON.parse(w.localStorage.getItem('timesup_partie_en_cours')).state;
    log('       paquet : ' + sauvegarde.masterDeck.length + ' cartes');
    check('le paquet est fait des cartes saisies', sauvegarde.masterDeck.length === 9);
    check('les cartes de l invite y sont', sauvegarde.masterDeck.includes('Parasol'));
    check('celles de l organisateur aussi', sauvegarde.masterDeck.includes('Alpha'));
    check('celles du joueur sans telephone aussi', sauvegarde.masterDeck.includes('Zeta'));

    log('SCENARIO 20 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
