<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — session partagée en mode nominatif</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

localStorage.removeItem('timesup_partie_en_cours');

const f = document.createElement('iframe');
f.src = '/';
f.style.cssText = 'width:420px;height:1100px;border:1px solid #ccc';
document.getElementById('hote').appendChild(f);

let demarre = false;
f.addEventListener('load', async () => {
  if (demarre) return;
  demarre = true;

  const d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const visible = id => $(id).style.display !== 'none';
  const equipiers = () => [...d.querySelectorAll('#repartition-liste .equipier')]
    .map(e => ({ prenom: e.querySelector('span').textContent, equipe: e.querySelector('button').textContent }));

  // Un invite complet : il rejoint et depose ses cartes
  async function invite(code, prenom, cartes) {
    const r = await api('rejoindre', { code, prenom });
    await api('deposer', { code, idJoueur: r.corps.idJoueur, cartes, fini: true });
    return r.corps.idJoueur;
  }

  try {
    await wait(1200);

    // ===== Le mode nominatif reste selectionne, sans saisir de joueurs =====
    $('btn-start').click();
    d.querySelector('[data-source="custom"]').click();

    // ===== La composition du paquet, avant l ouverture =====
    check('un reglage precede l ouverture', ecran() === 'screen-session-ouvrir');
    // 10 joueurs x 3 cartes = 30, le minimum acceptable
    for (let i = 0; i < 4; i++) $('btn-joueurs-plus').click();
    $('btn-cartes-moins').click();
    $('btn-cartes-moins').click();
    check('3 cartes par joueur', $('session-cartes-valeur').textContent === '3');
    check('le paquet atteint le minimum',
          $('session-cartes-estimation').textContent === '30 cartes dans le paquet');

    $('btn-ouvrir-session').click();
    await wait(900);
    check('l ecran de session s ouvre', ecran() === 'screen-session');
    const code = $('session-code').textContent.trim();
    log('       code : ' + code);

    // ===== Quatre invites saisissent leurs cartes =====
    await invite(code, 'Marc', ['M1', 'M2', 'M3']);
    await invite(code, 'Inès', ['I1', 'I2', 'I3']);
    await invite(code, 'Sam', ['S1', 'S2', 'S3']);
    await invite(code, 'Jo', ['J1', 'J2', 'J3']);
    await wait(2600);
    check('la suite est proposee une fois tout le monde pret',
          !$('btn-session-lancer').disabled);

    $('btn-session-lancer').click();
    await wait(500);
    check('le paquet de 12 cartes est signale comme court',
          $('dialog-overlay').style.display !== 'none');
    $('dialog-confirm').click();
    await wait(700);
    check('la configuration reprend par le mode de jeu', ecran() === 'screen-jeu-mode');
    check('les deux facons de jouer sont proposees',
          !!d.querySelector('[data-mode="nominatif"]') && !!d.querySelector('[data-mode="simple"]'));

    const r = await api('etat', { code });
    check('la saisie est close', r.corps.ouverte === false);

    // Les prenoms viennent des scans : on passe directement aux equipes
    d.querySelector('[data-mode="nominatif"]').click();
    await wait(300);
    check('a 4 joueurs, on passe a la repartition', ecran() === 'screen-repartition');
    check('aucune boite d erreur', $('dialog-overlay').style.display === 'none');
    check('un retour en arriere est possible', !!d.querySelector('#screen-repartition .btn-back'));
    check('le bouton mene a l etape suivante, pas au jeu',
          $('btn-repartition-jouer').textContent.includes('Suivant'));

    const liste = equipiers();
    log('       repartition : ' + JSON.stringify(liste));
    check('les 4 prenoms viennent des scans', liste.length === 4);
    check('ils sont ceux saisis par les joueurs',
          liste.map(e => e.prenom).sort().join(',') === 'Inès,Jo,Marc,Sam');
    check('les equipes sont pre-remplies', liste.every(e => e.equipe.includes('Équipe')));
    check('elles sont equilibrees',
          liste.filter(e => e.equipe.includes('1')).length === 2);

    // ===== On bascule un joueur d equipe =====
    const avant = equipiers()[0].equipe;
    d.querySelector('#repartition-liste .equipier button').click();
    check('un tap change l equipe du joueur', equipiers()[0].equipe !== avant);
    d.querySelector('#repartition-liste .equipier button').click();
    check('un second tap la remet', equipiers()[0].equipe === avant);

    $('btn-repartition-melanger').click();
    check('melanger garde les 4 joueurs', equipiers().length === 4);
    check('et garde l equilibre',
          equipiers().filter(e => e.equipe.includes('1')).length === 2);

    // ===== Une equipe vide est refusee =====
    equipiers().forEach((_, i) => {
      const boutons = [...d.querySelectorAll('#repartition-liste .equipier button')];
      if (boutons[i].textContent.includes('2')) boutons[i].click();
    });
    check('tous les joueurs sont dans la meme equipe',
          equipiers().every(e => e.equipe.includes('1')));
    $('btn-repartition-jouer').click();
    await wait(300);
    check('une equipe vide est refusee', $('dialog-overlay').style.display !== 'none');
    check('elle est nommee', $('dialog-message').textContent.includes('Équipe 2'));
    $('dialog-confirm').click();
    await wait(200);
    check('on reste sur la repartition', ecran() === 'screen-repartition');
    $('btn-repartition-melanger').click();

    // ===== Retour en arriere, puis suite =====
    d.querySelector('#screen-repartition .btn-back').click();
    check('le retour ramene au mode de jeu', ecran() === 'screen-jeu-mode');
    d.querySelector('[data-mode="nominatif"]').click();
    await wait(300);
    check('et on revient a la repartition', ecran() === 'screen-repartition');

    $('btn-repartition-jouer').click();
    await wait(300);
    check('la repartition mene aux manches', ecran() === 'screen-rounds');

    // ===== Le retour depuis les manches revient bien a la repartition =====
    d.querySelector('#screen-rounds .btn-back').click();
    check('retour depuis les manches : on retrouve la repartition', ecran() === 'screen-repartition');
    check('les equipes formees sont conservees', equipiers().length === 4);
    $('btn-repartition-jouer').click();
    await wait(200);
    check('et on repart vers les manches', ecran() === 'screen-rounds');

    // Les equipes etant formees, l'effectif exact est connu : 2 par equipe
    check('aucune question d effectif n est posee', !visible('puppet-confirm'));
    const pantin = [...d.querySelectorAll('#rounds-optional .round-pill')].find(p => p.textContent.includes('bouger'));
    check('la manche pantin est verrouillee d elle-meme', pantin.disabled);
    check('une explication chiffree est donnee', $('rounds-note').textContent.includes('en compte 2'));

    $('btn-next-rounds').click();
    check('puis le deroulement', ecran() === 'screen-config');
    $('btn-play').click();
    // Parties a themes : l app propose de partager le suivi avant de lancer
    $('dialog-cancel').click();
    await wait(0);
    await wait(700);
    check('la partie demarre', ecran() === 'screen-round');

    // ===== La composition des equipes reste consultable =====
    check('un acces aux equipes est propose', !!$('btn-voir-equipes') && visible('btn-voir-equipes'));
    // Depuis le lot 5 il vit dans le bandeau, comme chez les invites : il ne
    // bouge plus d un etat a l autre de l ecran, et ne pousse rien vers le bas.
    check('il est loge dans le bandeau',
          $('round-bandeau').contains($('btn-voir-equipes')));
    check('il est discret', $('btn-voir-equipes').classList.contains('bandeau-equipes'));

    $('btn-voir-equipes').click();
    check('la fenetre s ouvre', visible('equipes-overlay'));
    // Cette fenetre est celle de l organisateur (index.html), pas encore refaite :
    // ses lignes ne portent que le prenom, sans pastille. Elle passera au lot 5.
    const blocs = [...d.querySelectorAll('#equipes-contenu .equipe-bloc')];
    check('les deux equipes sont affichees', blocs.length === 2);
    const affiches = blocs.flatMap(b => [...b.querySelectorAll('li')].map(li => li.textContent));
    log('       equipes : ' + blocs.map(b =>
      b.querySelector('h4').textContent + ' = ' +
      [...b.querySelectorAll('li')].map(li => li.textContent).join(', ')).join('  |  '));
    check('les 4 joueurs y figurent', affiches.length === 4);
    check('ce sont ceux de la partie',
          ['Marc', 'Inès', 'Sam', 'Jo'].every(p => affiches.includes(p)));
    check('chaque equipe porte son nom',
          blocs.every(b => b.querySelector('h4').textContent.includes('Équipe')));
    check('aucun moyen de modifier depuis cette fenetre',
          d.querySelectorAll('#equipes-contenu button').length === 0);

    $('btn-equipes-fermer').click();
    check('la fenetre se referme', !visible('equipes-overlay'));
    check('et on reste sur le debut de tour', ecran() === 'screen-round');

    $('btn-voir-equipes').click();
    $('equipes-overlay').click();
    check('un clic a cote referme aussi', !visible('equipes-overlay'));

    const etat = JSON.parse(w.localStorage.getItem('timesup_partie_en_cours')).state;
    log('       paquet : ' + etat.masterDeck.length + ' cartes, joueurs : ' + JSON.stringify(etat.players));
    check('la manche pantin a bien ete retiree', !etat.activeRounds.includes(4));
    check('les autres manches sont conservees', etat.activeRounds.length === 3);
    check('le paquet reunit les 4 saisies', etat.masterDeck.length === 12);
    check('les joueurs sont ceux de la session', etat.players.length === 4);
    check('chaque equipe a des joueurs',
          etat.teams[0].players.length > 0 && etat.teams[1].players.length > 0);
    check('les deux equipes sont equilibrees',
          etat.teams[0].players.length === 2 && etat.teams[1].players.length === 2);
    check('le mode nominatif est conserve', etat.nominativeMode === true);
    check('un joueur est annonce a l ecran', $('current-player').textContent.length > 0);

    log('SCENARIO 21 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
