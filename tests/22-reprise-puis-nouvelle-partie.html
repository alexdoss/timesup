<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — nouvelle partie après une reprise</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

// Une partie en cartes perso interrompue : aucun theme selectionne.
// C'est ce cas qui faisait diverger l'affichage et l'etat reel.
localStorage.setItem('timesup_partie_en_cours', JSON.stringify({
  version: 1, savedAt: Date.now(),
  state: {
    teams: [{ name: 'Équipe 1', score: 0, players: [], currentPlayerIndex: 0, color: '#d6336c' },
            { name: 'Équipe 2', score: 0, players: [], currentPlayerIndex: 0, color: '#33c26a' }],
    players: [], playerStats: {}, playerAssignments: {}, nominativeMode: false,
    cardSource: 'custom', customCards: ['Un', 'Deux', 'Trois'], selectedThemes: [],
    activeRounds: [0, 1, 2], assignMode: 'random', startingTeam: 0, currentTeam: 0,
    currentRound: 0, turnTime: 40, numCards: 5, passMode: 'unlimited', passLimit: 2,
    passReplace: 'bottom', passCount: 0, masterDeck: ['Un', 'Deux', 'Trois'],
    deck: ['Un', 'Deux', 'Trois'], currentCardIndex: 0, turnScore: 0, timeLeft: 40,
    turnActive: false, turnFound: [], turnMissed: [], turnTeam: 0, turnPlayer: null,
    roundStartScores: [0, 0], sessionScores: [0, 0], gamesPlayed: 0
  }
}));

const f = document.createElement('iframe');
f.src = '/';
f.style.cssText = 'width:420px;height:900px;border:1px solid #ccc';
document.getElementById('hote').appendChild(f);

let demarre = false;
f.addEventListener('load', async () => {
  if (demarre) return;
  demarre = true;

  const d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const themes = () => [...d.querySelectorAll('#theme-selector .btn-theme')];
  const tuile = source => d.querySelector(`[data-source="${source}"]`);

  try {
    await wait(1200);

    // ===== On reprend la partie interrompue, puis on l abandonne =====
    check('une partie interrompue est proposee', $('resume-block').style.display !== 'none');
    $('btn-resume').click();
    await wait(300);
    check('la partie reprend', ecran() === 'screen-round');

    $('btn-pause').click();
    await wait(100);
    $('btn-abandon-game').click();
    await wait(100);
    $('dialog-confirm').click();
    await wait(400);
    check('apres abandon, retour a l accueil', ecran() === 'screen-home');
    check('plus rien a reprendre', $('resume-block').style.display === 'none');

    // ===== Nouvelle partie : l affichage doit refleter l etat reel =====
    $('btn-start').click();
    check('etape du type de partie', ecran() === 'screen-mode');
    // Choisir vaut avancer : aucune tuile n est allumee d avance, sans quoi
    // elle laisserait croire qu il reste un « Suivant » a presser.
    check('aucune tuile n est pre-selectionnee',
          d.querySelectorAll('[data-source].active').length === 0);
    check('les deux types de partie restent proposes',
          !!tuile('custom') && !!tuile('themes'));

    // ===== On choisit des themes predefinis =====
    tuile('themes').click();
    // Le clic vaut choix ET validation : on le lit a l ecran atteint
    check('le clic mene directement au choix des themes', ecran() === 'screen-themes');
    check('l autre tuile se desactive', !tuile('custom').classList.contains('active'));

    d.querySelector('[data-source="themes"]').click();
    check('on arrive bien sur le choix des themes', ecran() === 'screen-themes');

    // C'est ici que le defaut se manifestait : le clic etait perdu
    const premier = themes()[0];
    log('       theme choisi : ' + premier.textContent);
    check('aucun theme n est coche au depart', themes().every(b => !b.classList.contains('active')));
    premier.click();
    check('le theme apparait coche', premier.classList.contains('active'));

    $('btn-next-step').click();
    await wait(300);
    log('       ecran : ' + ecran() + (($('dialog-overlay').style.display !== 'none') ? ' + boite « ' + $('dialog-title').textContent + ' »' : ''));
    check('la selection est prise en compte', ecran() === 'screen-players');
    check('aucune boite « Aucun thème sélectionné »', $('dialog-overlay').style.display === 'none');

    // ===== Et la deselection fonctionne toujours =====
    d.querySelector('#screen-players .btn-back').click();
    check('retour au choix des themes', ecran() === 'screen-themes');
    themes()[0].click();
    check('le theme se decoche', !themes()[0].classList.contains('active'));
    $('btn-next-step').click();
    await wait(300);
    check('sans theme, on est bien arrete', ecran() === 'screen-themes');
    check('et une boite l explique', $('dialog-overlay').style.display !== 'none');
    check('elle nomme le probleme', $('dialog-title').textContent.includes('Aucun thème'));

    log('SCENARIO 22 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
