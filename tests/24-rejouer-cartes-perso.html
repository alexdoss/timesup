<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — rejouer en cartes perso</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

localStorage.removeItem('timesup_partie_en_cours');

const f = document.createElement('iframe');
f.src = '/';
f.style.cssText = 'width:420px;height:1100px;border:1px solid #ccc';
document.getElementById('hote').appendChild(f);

let demarre = false;
f.addEventListener('load', async () => {
  if (demarre) return;
  demarre = true;

  const d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const brut = () => w.localStorage.getItem('timesup_partie_en_cours');
  const etat = () => JSON.parse(brut() || 'null')?.state;
  const code = () => $('session-code').textContent.trim();

  async function invite(c, prenom, cartes) {
    const r = await api('rejoindre', { code: c, prenom });
    if (r.statut === 200) await api('deposer', { code: c, idJoueur: r.corps.idJoueur, cartes, fini: true });
    return r;
  }

  // Vide le paquet d'une traite pour terminer une manche
  async function jouerLaManche() {
    $('btn-start-turn').click();
    let n = 0;
    while (ecran() === 'screen-game' && n < 400) { $('btn-found').click(); n++; }
    $('btn-next-turn').click();
  }

  try {
    await wait(1200);

    // ===== PARTIE 1, en cartes perso partagees =====
    $('btn-start').click();
    d.querySelector('[data-source="custom"]').click();
    $('btn-next-mode').click();
    for (let i = 0; i < 4; i++) $('btn-joueurs-plus').click();   // 10 joueurs
    $('btn-cartes-moins').click();
    $('btn-cartes-moins').click();                                // 3 cartes
    $('btn-ouvrir-session').click();
    await wait(800);
    const code1 = code();

    await invite(code1, 'Marc', ['M1', 'M2', 'M3']);
    await invite(code1, 'Inès', ['I1', 'I2', 'I3']);
    await invite(code1, 'Sam', ['S1', 'S2', 'S3']);
    await invite(code1, 'Jo', ['J1', 'J2', 'J3']);
    await wait(2600);

    let r = await api('etat', { code: code1 });
    check('une partie neuve n a pas de liste fermee', (r.corps.attendus || []).length === 0);

    $('btn-session-lancer').click();
    await wait(500);
    $('dialog-confirm').click();          // paquet court, on passe outre
    await wait(700);
    check('la configuration reprend', ecran() === 'screen-players');
    $('btn-next-players').click();
    await wait(300);
    $('btn-repartition-jouer').click();
    await wait(300);
    $('btn-next-rounds').click();
    $('btn-play').click();
    await wait(500);
    check('la partie 1 demarre', ecran() === 'screen-round');

    const paquet1 = [...etat().masterDeck].sort().join(',');
    log('       paquet 1 : ' + paquet1);

    // On joue les 3 manches
    for (let m = 0; m < 3; m++) { await jouerLaManche(); if (m < 2) $('btn-next-round').click(); }
    $('btn-next-round').click();
    await wait(300);
    check('fin de la partie 1', ecran() === 'screen-final');
    check('la sauvegarde est effacee en fin de partie', brut() === null);

    // ===== REJOUER : une nouvelle session doit s ouvrir =====
    $('btn-replay').click();
    await wait(500);
    log('       ecran apres Rejouer : ' + ecran());
    check('rejouer mene au reglage du paquet, pas directement au jeu',
          ecran() === 'screen-session-ouvrir');
    // La partie 1 tablait sur 10 joueurs, 4 ont reellement saisi : on corrige
    check('la surestimation de la partie 1 est corrigee',
          $('session-joueurs-valeur').textContent === '4');
    check('les cartes par joueur suivent, pour tenir les 30',
          $('session-cartes-valeur').textContent === '8');
    check('le total annonce reste au-dessus du minimum',
          parseInt($('session-cartes-estimation').textContent, 10) >= 30);

    $('btn-ouvrir-session').click();
    await wait(800);
    check('une nouvelle session s ouvre', ecran() === 'screen-session');
    const code2 = code();
    check('avec un code different', code2 !== code1);

    // ===== La liste des joueurs est fermee =====
    r = await api('etat', { code: code2 });
    log('       liste attendue : ' + JSON.stringify(r.corps.attendus));
    check('la session connait les joueurs de la partie precedente',
          ['Marc', 'Inès', 'Sam', 'Jo'].every(p => r.corps.attendus.includes(p)));
    check('et personne d autre', r.corps.attendus.length === 4);

    const intrus = await api('rejoindre', { code: code2, prenom: 'Intrus' });
    log('       refus : ' + JSON.stringify(intrus.corps));
    check('un joueur hors liste est refuse', intrus.statut === 409);
    check('le refus est identifiable', intrus.corps.motif === 'hors-liste');
    check('le message renvoie a la liste', intrus.corps.error.includes('liste'));

    // A 4 joueurs, le minimum impose 8 cartes chacun pour atteindre 30
    const lot = prefixe => Array.from({ length: 8 }, (_, i) => prefixe + i);

    // ===== On ne peut pas relancer tant que tout le monde n a pas rejoint =====
    await invite(code2, 'Marc', lot('Nm'));
    await wait(2600);
    check('le lancement attend les absents', $('btn-session-lancer').disabled);
    log('       bouton : ' + $('btn-session-lancer').textContent);
    check('le bouton nomme combien manquent', $('btn-session-lancer').textContent.includes('3 joueurs'));

    await invite(code2, 'Inès', lot('Ni'));
    await invite(code2, 'Sam', lot('Ns'));
    await invite(code2, 'Jo', lot('Nj'));
    await wait(2600);
    check('une fois tous presents, on peut relancer', !$('btn-session-lancer').disabled);
    log('       bouton : ' + $('btn-session-lancer').textContent);
    check('le bouton propose de rejouer', $('btn-session-lancer').textContent.includes('Rejouer'));

    // ===== Relance : nouveau paquet, memes equipes, cumul conserve =====
    $('btn-session-lancer').click();
    await wait(900);
    check('la partie 2 demarre directement', ecran() === 'screen-round');

    const e2 = etat();
    const paquet2 = [...e2.masterDeck].sort().join(',');
    log('       paquet 2 : ' + paquet2);
    check('le paquet est entierement renouvele', paquet2 !== paquet1);
    check('il compte les 32 nouvelles cartes', e2.masterDeck.length === 32);
    check('il contient les nouvelles cartes', e2.masterDeck.includes('Nm0'));
    check('et aucune ancienne', !e2.masterDeck.some(c => paquet1.split(',').includes(c)));

    check('les joueurs sont les memes', e2.players.length === 4);
    check('les equipes sont conservees',
          e2.teams[0].players.length === 2 && e2.teams[1].players.length === 2);
    check('les scores de partie repartent a zero',
          e2.teams[0].score === 0 && e2.teams[1].score === 0);
    // 12 cartes rejouees a chacune des 3 manches de la partie 1
    check('le cumul de la soiree est conserve',
          e2.sessionScores[0] + e2.sessionScores[1] === 36);
    check('une partie est comptabilisee', e2.gamesPlayed === 1);
    check('on repart de la manche 1', e2.currentRound === 0);

    r = await api('etat', { code: code2 });
    check('la session de rejeu est close', r.corps.ouverte === false);

    log('SCENARIO 24 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
