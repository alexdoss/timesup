<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — detail par manche et par joueur</title></head>
<body>
<pre id="log">demarrage...</pre>
<iframe id="f" src="/" style="width:420px;height:1000px;border:1px solid #ccc"></iframe>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('f').addEventListener('load', async () => {
  const f = document.getElementById('f'), d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const entier = txt => parseInt(txt, 10);

  // Les manches detaillees sur l ecran de fin de partie
  const lignesManches = () => [...d.querySelectorAll('#final-scores .manche-passee')];
  // Le tableau des joueurs : une ligne par joueur, une colonne par manche, puis le total
  const lignesJoueurs = () => [...d.querySelectorAll('#stats-joueurs tbody tr')];
  const valeurs = tr => [...tr.querySelectorAll('td')].map(td => entier(td.textContent));

  function ajouterJoueur(nom) {
    $('player-name-input').value = nom;
    $('btn-add-player').click();
  }

  // Un tour suffit a vider le paquet : chaque manche a donc un seul marqueur,
  // et un marqueur different a chaque fois puisque le tour tourne.
  async function jouerLaManche() {
    $('btn-start-turn').click();
    let clics = 0;
    while (ecran() === 'screen-game' && clics < 300) { $('btn-found').click(); clics++; }
    $('btn-next-turn').click();
  }

  try {
    w.localStorage.removeItem('timesup_partie_en_cours');
    await wait(1200);

    // ===== Partie nominative a 6 joueurs =====
    $('btn-start').click();
    d.querySelector('[data-source="themes"]').click();
    d.querySelectorAll('#theme-selector .btn-theme')[0].click();
    $('btn-next-step').click();
    // Le dernier prenom porte du HTML : il vient d un invite en saisie partagee,
    // il ne doit jamais etre interprete
    ['Ana', 'Bob', 'Cleo', 'Dan', 'Eve', '<b>Zed</b>'].forEach(ajouterJoueur);
    check('6 joueurs ajoutes', $('player-count').textContent.startsWith('6'));
    $('btn-next-players').click();
    $('btn-next-rounds').click();
    $('btn-play').click();
    await wait(200);

    // ===== L ecran de lancement distingue manche et partie =====
    check('la partie demarre', ecran() === 'screen-round');
    check('le score de la manche demarre a zero',
          $('round-team1-score').textContent === '0' && $('round-team2-score').textContent === '0');
    check('le rappel du total est affiche', $('round-total').textContent.includes('Total de la partie'));

    // ===== Trois manches, un marqueur par manche =====
    for (const numero of [1, 2, 3]) {
      await jouerLaManche();
      if (numero < 3) {
        check(`fin de la manche ${numero}`, ecran() === 'screen-round-end');
        $('btn-next-round').click();
      }
    }
    check('fin de la manche 3', ecran() === 'screen-round-end');
    $('btn-next-round').click();
    check('ecran de fin de partie', ecran() === 'screen-final');

    // ===== Le detail par manche =====
    check('les trois manches sont detaillees', lignesManches().length === 3);
    const scoresManches = lignesManches().map(tr =>
      [entier(tr.children[1].textContent), entier(tr.children[2].textContent)]);
    log('       manches : ' + JSON.stringify(scoresManches));

    // ===== Le tiroir des joueurs =====
    const tiroir = $('stats-joueurs');
    check('un tiroir presente les joueurs', !!tiroir);
    check('il est replie au depart', !tiroir.open);
    log('       resume : "' + tiroir.querySelector('summary').textContent + '"');
    check('le resume annonce un joueur en tete',
          tiroir.querySelector('summary').textContent.includes('en tête avec'));

    tiroir.open = true;
    const lignes = lignesJoueurs();
    check('une ligne par joueur', lignes.length === 6);
    check('une colonne par manche, plus le total', valeurs(lignes[0]).length === 4);
    const enTetes = [...tiroir.querySelectorAll('thead th')].map(th => th.textContent);
    log('       colonnes : ' + enTetes.join(' | '));
    check('la premiere colonne nomme les joueurs', enTetes[0] === 'Joueur');
    check('la derniere donne le total', enTetes[enTetes.length - 1] === 'Tot.');
    // Chaque manche porte son nom en infobulle, et la colonne « Tot. » dit
    // quelle echelle elle affiche : la partie seule, ou le cumul de la serie.
    check('les manches sont reperees par leur icone',
          [...tiroir.querySelectorAll('thead th[title]')]
            .map(th => th.title).join(' | ')
            === 'Description libre | Un mot | Mime | Total de la partie');

    // ===== Les deux equipes sont separees, pas classees =====
    const bascule = lignes.findIndex(tr => tr.classList.contains('change-equipe'));
    check('un trait separe les deux equipes', bascule === 3);
    check('chaque joueur porte la couleur de son equipe',
          lignes.every(tr => !!tr.querySelector('.puce-equipe').style.background));

    // ===== Les chiffres se recoupent =====
    check('le total de chaque joueur vaut la somme de ses manches',
          lignes.every(tr => {
            const v = valeurs(tr);
            return v.slice(0, 3).reduce((a, b) => a + b, 0) === v[3];
          }));

    scoresManches.forEach((attendu, manche) => {
      const obtenu = [0, 0];
      lignes.forEach((tr, i) => { obtenu[i < bascule ? 0 : 1] += valeurs(tr)[manche]; });
      check(`manche ${manche + 1} : les joueurs totalisent le score de leur equipe`,
            obtenu[0] === attendu[0] && obtenu[1] === attendu[1]);
    });

    const marqueurs = lignes.filter(tr => valeurs(tr)[3] > 0);
    log('       marqueurs : ' + marqueurs.map(tr =>
      tr.querySelector('th').textContent + ' ' + valeurs(tr).join('/')).join('  |  '));
    check('trois joueurs ont marque, un par manche', marqueurs.length === 3);
    check('chacun a marque dans une seule manche',
          marqueurs.every(tr => valeurs(tr).slice(0, 3).filter(v => v > 0).length === 1));
    check('et ce ne sont pas les memes manches',
          new Set(marqueurs.map(tr => valeurs(tr).slice(0, 3).findIndex(v => v > 0))).size === 3);

    // ===== Un prenom n est jamais interprete comme du HTML =====
    const zed = lignes.find(tr => tr.querySelector('th').textContent.includes('Zed'));
    check('le prenom contenant des balises est bien present', !!zed);
    check('il est affiche tel quel', zed.querySelector('th').textContent.includes('<b>Zed</b>'));
    check('aucune balise n a ete interpretee', zed.querySelectorAll('b').length === 0);

    log('SCENARIO 25 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
