<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — l'invité suit la salle d'attente</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

// Ouvre la page a part, juste pour regarder si le bouton y figure
async function sonder(adresse) {
  const p = document.createElement('iframe');
  p.src = adresse;
  p.style.cssText = 'width:320px;height:200px;border:0;position:absolute;left:-9999px';
  document.body.appendChild(p);
  await new Promise(r => p.addEventListener('load', r, { once: true }));
  await wait(400);
  const present = !!p.contentDocument.getElementById('btn-suivre');
  p.remove();
  return present;
}

(async () => {
  try {
    // ===== L interrupteur d essai : la fonction est cachee par defaut =====
    localStorage.removeItem('timesup_rejoint');
    localStorage.removeItem('timesup_beta');

    check('sans marque, le bouton n existe meme pas dans la page',
          !(await sonder('/rejoindre.html')));
    check('l adresse d essai le fait apparaitre',
          await sonder('/rejoindre.html?beta=1'));
    check('la marque survit sans le parametre',
          await sonder('/rejoindre.html'));

    // ===== Une session avec deja deux joueurs, dont un en cours de saisie =====
    const creation = await api('creer', { cartesParJoueur: 3, mode: 'nominatif' });
    const code = creation.corps.code;
    const jeton = creation.corps.jeton;
    log('       session : ' + code);

    const ana = await api('rejoindre', { code, prenom: 'Ana' });
    await api('deposer', { code, idJoueur: ana.corps.idJoueur, cartes: ['A1', 'A2', 'A3'], fini: true });
    const bob = await api('rejoindre', { code, prenom: 'Bob' });
    await api('deposer', { code, idJoueur: bob.corps.idJoueur, cartes: ['B1'], fini: false });

    // ===== L invite ouvre la page et saisit ses cartes =====
    const f = document.createElement('iframe');
    f.src = '/rejoindre.html?c=' + code;
    f.style.cssText = 'width:420px;height:900px;border:1px solid #ccc';
    document.getElementById('hote').appendChild(f);
    await new Promise(r => f.addEventListener('load', r, { once: true }));

    const d = f.contentDocument, w = f.contentWindow;
    w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
    const $ = id => d.getElementById(id);
    const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
    const lignes = () => [...d.querySelectorAll('#attente-joueurs .connecte')];
    await wait(600);

    $('champ-prenom').value = 'Cleo';
    $('btn-prenom').click();
    await wait(700);
    check('l invite arrive sur la saisie', ecran() === 'screen-cartes');

    for (const mot of ['C1', 'C2', 'C3']) {
      $('champ-carte').value = mot;
      $('btn-ajouter').click();
    }
    await wait(1200);
    $('btn-terminer').click();
    await wait(900);
    check('ses cartes sont envoyees', ecran() === 'screen-envoye');

    // ===== Le bouton demande par l US =====
    const suivre = $('btn-suivre');
    const modifier = $('btn-modifier');
    check('un bouton propose de suivre la partie', !!suivre);
    check('il est place au-dessus de « Modifier mes cartes »',
          suivre.nextElementSibling === modifier);
    check('c est le bouton principal, l autre passe au second plan',
          suivre.classList.contains('btn-primary') && modifier.classList.contains('btn-secondary'));
    log('       texte : "' + suivre.textContent.trim() + '"');
    check('la phrase qui disait de ranger son telephone a disparu',
          !$('screen-envoye').textContent.includes('Range ton téléphone'));

    // ===== La salle d attente =====
    suivre.click();
    await wait(700);
    check('la salle d attente s ouvre', ecran() === 'screen-attente');
    check('les trois joueurs sont listes', lignes().length === 3);
    log('       liste : ' + lignes().map(l => l.textContent.replace(/\s+/g, ' ').trim()).join('  |  '));

    // L ordre doit etre stable d un rafraichissement a l autre, sans quoi la
    // liste se reordonnerait toutes les deux secondes sous les yeux du joueur
    check('la liste est rangee par ordre alphabetique',
          lignes().map(l => l.textContent.match(/[A-Za-zÀ-ÿ]+/)[0]).join(',') === 'Ana,Bob,Cleo');

    const texte = $('attente-joueurs').textContent;
    check('celui qui a fini est marque', texte.includes('Ana') && texte.includes('3 cartes ✓'));
    check('celui qui saisit encore montre sa progression', texte.includes('1/3'));
    check('l invite se reconnait', lignes().some(l => l.textContent.includes('Cleo')
          && l.textContent.includes('toi')));
    check('aucun bouton de retrait, reserve a l organisateur',
          d.querySelectorAll('#attente-joueurs button').length === 0);
    check('le compte des joueurs prets est donne',
          $('attente-total').textContent.includes('2 joueur(s) sur 3'));

    // ===== Le rafraichissement est automatique =====
    await api('deposer', { code, idJoueur: bob.corps.idJoueur, cartes: ['B1', 'B2', 'B3'], fini: true });
    await wait(2600);
    check('la progression des autres arrive sans rien toucher',
          $('attente-joueurs').textContent.includes('3 cartes ✓')
          && !$('attente-joueurs').textContent.includes('1/3'));
    check('le compte suit', $('attente-total').textContent.includes('3 joueur(s) sur 3'));

    // ===== L ecran s eteint, puis se rallume =====
    // Passer d une fenetre a l autre suffit a declencher ce cas. La reprise
    // doit relancer les lectures : sans quoi la salle d attente reste figee
    // pour toujours, sans que rien ne le signale.
    const cacher = valeur =>
      Object.defineProperty(d, 'hidden', { configurable: true, get: () => valeur });

    cacher(true);
    d.dispatchEvent(new w.Event('visibilitychange'));
    await api('rejoindre', { code, prenom: 'Dan' });
    await wait(2600);
    check('en veille, plus aucune lecture', lignes().length === 3);

    cacher(false);
    d.dispatchEvent(new w.Event('visibilitychange'));
    await wait(600);
    check('au reveil, la liste se remet a jour', lignes().length === 4);
    await api('deposer', { code, idJoueur: (await api('etat', { code })).corps.joueurs
      .find(j => j.prenom === 'Dan').id, cartes: ['D1', 'D2', 'D3'], fini: true });
    await wait(2600);
    check('et les lectures reprennent vraiment leur rythme',
          $('attente-total').textContent.includes('4 joueur(s) sur 4'));

    // ===== Retour en arriere tant que la partie n a pas demarre =====
    check('un retour est propose', $('btn-attente-retour').style.display !== 'none');
    $('btn-attente-retour').click();
    await wait(300);
    check('le retour ramene a l ecran de confirmation', ecran() === 'screen-envoye');
    check('on peut toujours modifier ses cartes', !$('btn-modifier').disabled);

    // ===== Quand l organisateur lance la partie =====
    $('btn-suivre').click();
    await wait(600);
    await api('fermer', { code, jeton });
    await wait(2600);
    log('       titre : "' + $('attente-titre').textContent + '"');
    check('le depart de la partie est annonce',
          $('attente-titre').textContent.includes('commencé'));
    check('le retour disparait : on ne modifie plus rien',
          $('btn-attente-retour').style.display === 'none');
    // 4 joueurs x 3 cartes depuis l arrivee de Dan
    log('       total : "' + $('attente-total').textContent + '"');
    check('le paquet complet est annonce', $('attente-total').textContent.includes('12 cartes'));

    // ===== On peut aussi eteindre l interrupteur =====
    check('beta=0 retire la marque', !(await sonder('/rejoindre.html?beta=0')));

    log('SCENARIO 28 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
})();
</script>
</body>
</html>
