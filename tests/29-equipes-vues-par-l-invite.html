<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — l'app publie, l'invité voit les équipes</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote" style="display:flex;gap:8px"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

function cadre(src, largeur) {
  const f = document.createElement('iframe');
  f.src = src;
  f.style.cssText = `width:${largeur}px;height:1000px;border:1px solid #ccc`;
  document.getElementById('hote').appendChild(f);
  return new Promise(r => f.addEventListener('load', () => r(f), { once: true }));
}

localStorage.removeItem('timesup_partie_en_cours');
localStorage.removeItem('timesup_suivi');
localStorage.removeItem('timesup_rejoint');
localStorage.setItem('timesup_beta', '1');

(async () => {
  try {
    // ===== L organisateur ouvre une session de cartes perso =====
    const app = await cadre('/', 400);
    const da = app.contentDocument, wa = app.contentWindow;
    wa.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
    const A = id => da.getElementById(id);
    const ecranApp = () => [...da.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
    await wait(1200);

    A('btn-start').click();
    da.querySelector('[data-source="custom"]').click();
    A('btn-next-mode').click();
    for (let i = 0; i < 4; i++) A('btn-joueurs-plus').click();
    A('btn-cartes-moins').click();
    A('btn-cartes-moins').click();
    A('btn-ouvrir-session').click();
    await wait(900);
    const code = A('session-code').textContent.trim();
    log('       session : ' + code);

    // Trois invites deposent leurs cartes par le reseau
    for (const [prenom, cartes] of [['Ana', ['A1','A2','A3']], ['Bob', ['B1','B2','B3']], ['Dan', ['D1','D2','D3']]]) {
      const r = await api('rejoindre', { code, prenom });
      await api('deposer', { code, idJoueur: r.corps.idJoueur, cartes, fini: true });
    }

    // ===== Le quatrieme invite ouvre la VRAIE page invite =====
    const inv = await cadre('/rejoindre.html?c=' + code, 400);
    const di = inv.contentDocument, wi = inv.contentWindow;
    wi.onerror = (m, s, l) => log('ERREUR INVITE: ' + m + ' @' + s + ':' + l);
    const I = id => di.getElementById(id);
    await wait(700);

    I('champ-prenom').value = 'Cleo';
    I('btn-prenom').click();
    await wait(700);
    for (const mot of ['C1', 'C2', 'C3']) {
      I('champ-carte').value = mot;
      I('btn-ajouter').click();
    }
    await wait(1200);
    I('btn-terminer').click();
    await wait(900);
    I('btn-suivre').click();
    await wait(800);
    check('l invite suit la salle d attente',
          [...di.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id === 'screen-attente');
    check('les quatre joueurs y figurent',
          di.querySelectorAll('#attente-joueurs .connecte').length === 4);

    // ===== L organisateur ferme la saisie et configure =====
    await wait(2600);
    A('btn-session-lancer').click();
    await wait(600);
    A('dialog-confirm').click();     // paquet court, on lance quand meme
    await wait(900);
    check('l organisateur passe aux equipes', ecranApp() === 'screen-players');
    check('le mode nominatif est bien celui par defaut',
          da.querySelector('[data-mode="nominatif"]').classList.contains('active'));

    // La saisie est close : l invite doit basculer sur l ecran de configuration
    await wait(2600);
    log('       titre invite : "' + I('attente-titre').textContent + '"');
    check('l invite voit la configuration en cours',
          I('attente-titre').textContent.includes('Configuration'));
    check('aucun acces aux equipes : elles ne sont pas encore reparties',
          I('btn-voir-equipes').style.display === 'none');

    A('btn-next-players').click();
    await wait(400);
    check('l organisateur arrive sur la repartition', ecranApp() === 'screen-repartition');

    // ===== LE MOMENT QUI COMPTE : la validation des equipes =====
    A('btn-repartition-jouer').click();
    await wait(500);
    check('l organisateur passe aux manches', ecranApp() === 'screen-rounds');

    // Ce que l app a reellement publie
    const publie = (await api('suivre', { code })).corps.suivi;
    check('un etat a bien ete publie', !!publie);
    if (publie) {
      log('       publie : etape=' + publie.etat.etape + ' equipes='
          + JSON.stringify(publie.etat.equipes.map(e => e.joueurs)));
      check('l etape annonce la configuration', publie.etat.etape === 'configuration');
      check('les prenoms accompagnent les equipes',
            publie.etat.equipes.every(e => Array.isArray(e.joueurs) && e.joueurs.length > 0));
      check('les quatre joueurs sont repartis',
            publie.etat.equipes.reduce((n, e) => n + e.joueurs.length, 0) === 4);
    }

    // ===== Et ce que l invite en fait =====
    await wait(2600);
    log('       bouton invite : display="' + I('btn-voir-equipes').style.display + '"');
    check('le bouton des equipes apparait chez l invite',
          I('btn-voir-equipes').style.display !== 'none');

    I('btn-voir-equipes').click();
    await wait(300);
    check('la fenetre s ouvre', I('equipes-overlay').style.display !== 'none');
    const blocs = [...di.querySelectorAll('#equipes-contenu .equipe-bloc')];
    check('les deux equipes sont affichees', blocs.length === 2);
    const noms = blocs.flatMap(b => [...b.querySelectorAll('li')].map(li => li.textContent));
    log('       equipes vues : ' + blocs.map(b =>
      b.querySelector('h4').textContent + ' = ' +
      [...b.querySelectorAll('li')].map(li => li.textContent).join(', ')).join('  |  '));
    check('les quatre joueurs y sont', noms.length === 4);
    check('ce sont ceux de la session',
          ['Ana', 'Bob', 'Cleo', 'Dan'].every(p => noms.includes(p)));
    check('l invite se retrouve en evidence',
          di.querySelector('#equipes-contenu li.moi')?.textContent === 'Cleo');

    // ===== L organisateur revient sur les equipes et les modifie =====
    // La fenetre de l invite est restee OUVERTE : elle doit suivre le changement,
    // sinon il lit une composition perimee sans rien qui le lui signale.
    const avant = blocs.map(b => [...b.querySelectorAll('li')].map(li => li.textContent).join(','));

    da.querySelector('#screen-rounds .btn-back').click();
    await wait(400);
    check('l organisateur retrouve la repartition', ecranApp() === 'screen-repartition');
    da.querySelector('#repartition-liste .equipier button').click();   // un joueur change d equipe
    A('btn-repartition-jouer').click();
    await wait(500);

    const republie = (await api('suivre', { code })).corps.suivi;
    log('       republie : v' + republie.v + ' '
        + JSON.stringify(republie.etat.equipes.map(e => e.joueurs)));
    check('la modification est republiee', republie.v > publie.v);
    check('la nouvelle composition est differente',
          JSON.stringify(republie.etat.equipes.map(e => e.joueurs)) !==
          JSON.stringify(publie.etat.equipes.map(e => e.joueurs)));

    await wait(2600);
    const apres = [...di.querySelectorAll('#equipes-contenu .equipe-bloc')]
      .map(b => [...b.querySelectorAll('li')].map(li => li.textContent).join(','));
    log('       avant : ' + avant.join(' | ') + '   apres : ' + apres.join(' | '));
    check('la fenetre ouverte chez l invite se met a jour',
          JSON.stringify(apres) !== JSON.stringify(avant));
    check('les quatre joueurs y sont toujours',
          di.querySelectorAll('#equipes-contenu li').length === 4);

    // ===== Sans changement, la fenetre ouverte n est pas redessinee =====
    // Une liste de vingt joueurs reconstruite toutes les deux secondes
    // ramenerait au debut celui qui la fait defiler.
    const premierNom = di.querySelector('#equipes-contenu li');
    premierNom.dataset.temoin = 'intact';
    await wait(5000);   // plusieurs cycles de lecture
    check('sans changement, la liste n est pas reconstruite',
          di.querySelector('#equipes-contenu li').dataset.temoin === 'intact');

    // Refermer puis rouvrir doit evidemment montrer la meme chose
    I('btn-equipes-fermer').click();
    await wait(200);
    I('btn-voir-equipes').click();
    await wait(200);
    const rouvert = [...di.querySelectorAll('#equipes-contenu .equipe-bloc')]
      .map(b => [...b.querySelectorAll('li')].map(li => li.textContent).join(','));
    check('rouvrir la fenetre donne le meme resultat',
          JSON.stringify(rouvert) === JSON.stringify(apres));

    // ===== L organisateur lance la partie : l invite voit le debut de tour =====
    I('btn-equipes-fermer').click();
    A('btn-next-rounds').click();
    await wait(300);
    A('btn-play').click();
    await wait(800);
    check('l organisateur est sur le debut de tour', ecranApp() === 'screen-round');

    await wait(2600);
    const L = id => I(id).textContent.trim();
    log('       invite voit : "' + L('lancement-titre') + '" · "' + L('lancement-nom')
        + '" · "' + L('lancement-tour') + '" · "' + L('lancement-joueur') + '"');

    check('le bloc de lancement s affiche',
          I('bloc-lancement').style.display !== 'none');
    check('l en-tete de configuration a cede la place',
          I('attente-roue').style.display === 'none');
    check('la manche est annoncee', L('lancement-titre') === 'Manche 1/3');
    check('elle est nommee', L('lancement-nom').length > 3);
    check('sa consigne est rappelee', L('lancement-regle').length > 20);
    check('l equipe qui joue est annoncee', L('lancement-tour').includes('Équipe'));
    check('le joueur qui fait deviner aussi', L('lancement-joueur').includes('fait deviner'));
    check('les scores de manche sont a zero',
          L('lancement-s1') === '0' && L('lancement-s2') === '0');
    check('le total de la partie est rappele',
          L('lancement-total').includes('Total de la partie'));
    check('les equipes restent consultables',
          I('btn-voir-equipes').style.display !== 'none');

    // Le bouton de lancement reste a la main de l organisateur
    check('aucun bouton pour lancer le tour cote invite',
          !di.getElementById('btn-start-turn')
          && !I('bloc-lancement').textContent.includes('Lancer le tour'));

    // ===== Apres un tour, c est bien la PROCHAINE equipe qui est annoncee =====
    const premiereEquipe = L('lancement-tour');
    const premierJoueur = L('lancement-joueur');
    A('btn-start-turn').click();
    await wait(500);

    // ===== Le tour en cours : le telephone devient l horloge de la table =====
    await wait(2600);
    check('l invite bascule sur le tour en cours',
          I('bloc-tour').style.display !== 'none');
    check('l ecran de lancement a cede la place',
          I('bloc-lancement').style.display === 'none');
    const chrono1 = Number(L('tour-chrono'));
    log('       chrono invite : ' + chrono1 + ' s · "' + L('tour-qui') + '"');
    check('un chrono est affiche', chrono1 > 0 && chrono1 <= 40);
    check('il est deja entame', chrono1 < 40);
    check('la manche reste rappelee', L('tour-manche').includes('Manche'));
    check('on sait qui fait deviner', L('tour-qui').includes('fait deviner'));
    check('les equipes ne sont plus consultables pendant le tour',
          I('btn-voir-equipes').style.display === 'none');
    check('aucune carte du paquet n est visible',
          !I('bloc-tour').textContent.match(/tire-bouchon|boussole|Cleopatre/));

    // Le sablier : le sable du haut baisse, celui du bas s accumule
    const sable = id => Number(I(id).getAttribute('height'));
    const haut1 = sable('sable-haut'), bas1 = sable('sable-bas');
    log('       sablier : haut=' + haut1 + ' bas=' + bas1
        + ' filet=' + sable('sable-filet'));
    check('le sablier est dessine', haut1 > 0);
    check('le filet coule pendant le tour', sable('sable-filet') > 0);

    // Le nombre au-dessus du sablier, et l ecran qui tient sans defiler
    const rNombre = I('tour-chrono').getBoundingClientRect();
    const rSablier = di.querySelector('#tour-bloc-chrono .sablier').getBoundingClientRect();
    const hBloc = I('tour-bloc-chrono').getBoundingClientRect().height;
    log('       chrono a ' + Math.round(rNombre.top) + ', sablier a '
        + Math.round(rSablier.top) + ', bloc de ' + Math.round(hBloc) + ' px');
    check('le nombre est au-dessus du sablier', rNombre.bottom <= rSablier.top + 2);
    check('les deux sont alignes sur le meme axe',
          Math.abs((rNombre.left + rNombre.width / 2)
                   - (rSablier.left + rSablier.width / 2)) < 6);
    check('le bloc reste dans les limites mesurees', hBloc > 180 && hBloc < 260);

    // Le decompte tourne en local, sans attendre le serveur
    await wait(3000);
    const chrono2 = Number(L('tour-chrono'));
    log('       trois secondes plus tard : ' + chrono2 + ' s');
    check('le chrono descend', chrono2 < chrono1);
    check('et il descend a la bonne vitesse',
          Math.abs((chrono1 - chrono2) - 3) <= 1);
    check('le sable du haut a baisse', sable('sable-haut') < haut1);
    check('et le tas du bas a grossi', sable('sable-bas') > bas1);

    // Deux cartes seulement : on laisse le chrono s ecouler plutot que de vider
    // le paquet, sinon la manche s acheve et il n y a pas de tour suivant.
    A('btn-found').click();
    A('btn-found').click();
    let n = 0;
    while (ecranApp() === 'screen-game' && n < 60) { await wait(1000); n++; }
    check('le tour s est acheve au chrono', ecranApp() === 'screen-turn-end');
    A('btn-next-turn').click();
    await wait(800);
    check('l organisateur revient au debut de tour', ecranApp() === 'screen-round');

    await wait(2600);
    log('       tour suivant : "' + L('lancement-tour') + '" · "' + L('lancement-joueur') + '"');
    check('la main passe a l autre equipe', L('lancement-tour') !== premiereEquipe);
    check('et a un autre joueur', L('lancement-joueur') !== premierJoueur);
    check('le score du tour precedent est reporte',
          Number(L('lancement-s1')) + Number(L('lancement-s2')) === 2);

    // ===== Fin de manche : le detail, comme chez l organisateur =====
    // On vide le paquet d une traite pour achever la manche
    A('btn-start-turn').click();
    await wait(400);
    let c2 = 0;
    while (ecranApp() === 'screen-game' && c2 < 400) { A('btn-found').click(); c2++; }
    await wait(600);
    A('btn-next-turn').click();
    await wait(900);
    check('l organisateur est en fin de manche', ecranApp() === 'screen-round-end');

    await wait(2600);
    const lignesRes = () => [...di.querySelectorAll('#resultats-scores tr')];
    log('       invite : "' + L('resultats-titre') + '" — '
        + lignesRes().map(t => t.querySelector('th').textContent).join(' | '));
    check('l invite voit les resultats', I('bloc-resultats').style.display !== 'none');
    check('le titre nomme la manche', L('resultats-titre').includes('Fin de la manche'));
    check('aucun vainqueur annonce avant la fin',
          I('resultats-vainqueur').style.display === 'none');
    check('la manche jouee est detaillee',
          lignesRes().some(t => t.classList.contains('manche-en-cours')));
    check('le total de la partie est la',
          lignesRes().some(t => t.classList.contains('score-total')));
    check('aucun detail par joueur en fin de manche',
          I('resultats-joueurs').children.length === 0);
    check('le sablier a disparu', I('bloc-tour').style.display === 'none');

    // ===== Fin de partie : on enchaine les manches restantes =====
    let boucles = 0;
    while (ecranApp() !== 'screen-final' && boucles < 12) {
      boucles++;
      if (ecranApp() === 'screen-round-end') { A('btn-next-round').click(); await wait(700); }
      else if (ecranApp() === 'screen-round') { A('btn-start-turn').click(); await wait(400); }
      else if (ecranApp() === 'screen-game') {
        let k = 0;
        while (ecranApp() === 'screen-game' && k < 400) { A('btn-found').click(); k++; }
        await wait(500);
      } else if (ecranApp() === 'screen-turn-end') { A('btn-next-turn').click(); await wait(700); }
      else await wait(500);
    }
    check('la partie est terminee cote organisateur', ecranApp() === 'screen-final');

    await wait(2600);
    log('       invite : "' + L('resultats-titre') + '" · "' + L('resultats-vainqueur') + '"');
    check('l invite voit la fin de partie', L('resultats-titre').includes('Fin de la partie'));
    check('un vainqueur est annonce',
          I('resultats-vainqueur').style.display !== 'none'
          && L('resultats-vainqueur').length > 5);
    check('les trois manches sont detaillees',
          di.querySelectorAll('#resultats-scores .manche-passee').length === 3);
    check('plus aucune manche marquee « en cours »',
          di.querySelectorAll('#resultats-scores .manche-en-cours').length === 0);
    check('le total de la partie est nomme',
          lignesRes().some(t => t.querySelector('th').textContent === 'Cette partie'));

    // Le zoom sur les joueurs
    const tiroir = I('resultats-tiroir-joueurs');
    check('un tiroir presente les joueurs', !!tiroir);
    check('il est replie au depart', tiroir && !tiroir.open);
    log('       resume : "' + tiroir.querySelector('summary').textContent + '"');
    check('le resume annonce le meilleur',
          tiroir.querySelector('summary').textContent.includes('en tête avec'));
    tiroir.open = true;
    const lj = [...di.querySelectorAll('#resultats-tiroir-joueurs tbody tr')];
    check('une ligne par joueur', lj.length === 4);
    const cols = [...tiroir.querySelectorAll('thead th')].map(t => t.textContent);
    log('       colonnes : ' + cols.join(' | '));
    check('une colonne par manche, plus le total', cols.length === 5);
    check('les manches portent leur icone',
          tiroir.querySelectorAll('thead th[title]').length === 3);
    check('chaque joueur porte la couleur de son equipe',
          lj.every(t => !!t.querySelector('.puce-equipe').style.background));
    check('un trait separe les deux equipes',
          di.querySelectorAll('#resultats-tiroir-joueurs .change-equipe').length === 1);
    check('le total de chaque joueur vaut la somme de ses manches',
          lj.every(t => {
            const v = [...t.querySelectorAll('td')].map(x => Number(x.textContent));
            return v.slice(0, 3).reduce((a, b) => a + b, 0) === v[3];
          }));
    check('l invite se retrouve en evidence',
          di.querySelector('#resultats-tiroir-joueurs th.moi')?.textContent === 'Cleo');
    check('aucun mot du paquet n a fuite',
          !I('bloc-resultats').textContent.match(/tire-bouchon|boussole|Cleopatre/));

    log('SCENARIO 29 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
})();
</script>
</body>
</html>
