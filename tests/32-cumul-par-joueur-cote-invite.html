<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — l'invité voit le cumul par joueur</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

// Le même paquet que publierEtat('fin-partie'), écrit à la main : ce scénario
// éprouve l affichage chez l invite, pas la partie qui l a produit.
const HISTORIQUE = [
  { nom: 'Description', icone: '💬', scores: [5, 3] },
  { nom: 'Un mot',      icone: '🔤', scores: [3, 5] },
  { nom: 'Mime',        icone: '🎭', scores: [3, 3] }
];
// Meilleur de la partie : Dan (7). Meilleur de la serie : Ana (17).
// Les deux different exprès, c est ce qui dit quelle echelle est affichee.
const JOUEURS = [
  { nom: 'Ana',  equipe: 0, parManche: [3, 1, 2], total: 6, serieParManche: [8, 4, 5],  serieTotal: 17 },
  { nom: 'Cleo', equipe: 0, parManche: [2, 2, 1], total: 5, serieParManche: [5, 4, 4],  serieTotal: 13 },
  { nom: 'Bob',  equipe: 1, parManche: [1, 2, 1], total: 4, serieParManche: [4, 6, 4],  serieTotal: 14 },
  { nom: 'Dan',  equipe: 1, parManche: [2, 3, 2], total: 7, serieParManche: [4, 4, 3],  serieTotal: 11 }
];

function paquet() {
  return {
    etape: 'fin-partie',
    manche: { numero: 3, sur: 3, nom: 'Mime', icone: '🎭', regle: 'Sans un mot' },
    equipes: [
      { nom: 'Équipe 1', couleur: '#d6336c', partie: 11, manche: 3, joueurs: ['Ana', 'Cleo'] },
      { nom: 'Équipe 2', couleur: '#33c26a', partie: 11, manche: 3, joueurs: ['Bob', 'Dan'] }
    ],
    tour: null,
    aVenir: null,
    historique: HISTORIQUE,
    // Troisieme partie de la soiree : les deux echelles coexistent
    cumul: { totaux: [30, 25], parties: 3 },
    joueurs: JOUEURS
  };
}

(async () => {
  try {
    localStorage.removeItem('timesup_rejoint');

    const creation = await api('creer', { cartesParJoueur: 3, mode: 'nominatif' });
    const code = creation.corps.code, jeton = creation.corps.jeton;
    log('       session : ' + code);

    for (const prenom of ['Ana', 'Bob', 'Dan']) {
      const j = await api('rejoindre', { code, prenom });
      await api('deposer', {
        code, idJoueur: j.corps.idJoueur,
        cartes: [prenom + '1', prenom + '2', prenom + '3'], fini: true
      });
    }

    // ===== L invite entre dans la partie, puis passe en suivi =====
    const f = document.createElement('iframe');
    f.src = '/rejoindre.html?c=' + code;
    f.style.cssText = 'width:420px;height:1000px;border:1px solid #ccc';
    document.getElementById('hote').appendChild(f);
    await new Promise(r => f.addEventListener('load', r, { once: true }));

    const d = f.contentDocument, w = f.contentWindow;
    w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
    const $ = id => d.getElementById(id);
    const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
    await wait(600);

    $('champ-prenom').value = 'Cleo';
    $('btn-prenom').click();
    await wait(700);
    check('l invite arrive sur la saisie', ecran() === 'screen-cartes');

    for (const mot of ['C1', 'C2', 'C3']) {
      $('champ-carte').value = mot;
      $('btn-ajouter').click();
      await wait(200);
    }
    $('btn-terminer').click();
    await wait(1500);
    // Plus d ecran de confirmation : terminer mene directement au suivi
    check('ses cartes sont envoyees', ecran() === 'screen-attente');
    await wait(2600);
    check('il suit la partie', ecran() === 'screen-attente');

    // Outils de lecture du tableau, cote invite
    const tiroir = () => $('resultats-tiroir-joueurs');
    const colonnes = () => [...tiroir().querySelectorAll('thead th')].map(t => t.textContent);
    const lire = () => [...d.querySelectorAll('#resultats-tiroir-joueurs tbody tr')].map(tr => {
      const cases = [...tr.querySelectorAll('td')].map(td => Number(td.textContent));
      return {
        nom: tr.querySelector('th').textContent,
        manches: cases.slice(0, cases.length - 1),
        total: cases[cases.length - 1]
      };
    });
    const memeListe = (a, b) => JSON.stringify(a) === JSON.stringify(b);

    // L organisateur lance : tant que la saisie reste ouverte, l invite regarde
    // la liste des joueurs et ne lit pas encore l etat publie.
    const cloture = await api('fermer', { code, jeton });
    check('la saisie est close, la partie peut commencer', cloture.statut === 200);

    // ===== Troisieme partie de la serie : les colonnes portent le cumul =====
    // Une seule publication : une fois la partie finie, l invite passe en veille
    // et guette une nouvelle partie au lieu de relire l etat publie. Le cas
    // « une partie seule » est couvert par le scenario 29.
    await api('publier', { code, jeton, v: 1, etat: paquet() });
    await wait(3000);
    check('l invite voit la fin de partie',
          $('resultats-titre').textContent.includes('Fin de la partie'));
    check('un tiroir presente les joueurs', !!tiroir());
    log('       colonnes : ' + colonnes().join(' | '));
    check('le tableau garde sa forme : les manches, puis le total',
          colonnes().length === 5 && colonnes().pop() === 'Tot.');
    check('aucune colonne de cumul n a ete ajoutee', !colonnes().includes('Σ'));
    check('l infobulle du total annonce la serie',
          [...tiroir().querySelectorAll('thead th')].pop().title === 'Cumul des 3 parties');
    check('les manches gardent leur icone',
          tiroir().querySelectorAll('thead th[title]').length === 4);

    const lignes = lire();
    log('       ' + lignes.map(l => `${l.nom} ${l.manches.join('/')}=${l.total}`).join('  |  '));
    check('une ligne par joueur', lignes.length === 4);
    check('chaque manche porte le cumul publie, pas le score de la partie',
          lignes.every(l => memeListe(l.manches,
            JOUEURS.find(j => j.nom === l.nom).serieParManche)));
    check('le total aussi',
          lignes.every(l => l.total === JOUEURS.find(j => j.nom === l.nom).serieTotal));
    check('et il vaut bien la somme de sa ligne',
          lignes.every(l => l.total === l.manches.reduce((a, b) => a + b, 0)));

    // Le cumul des joueurs doit s accorder avec celui des equipes, juste au dessus
    const cumulEquipes = [...d.querySelectorAll('#resultats-scores .score-cumul .score')]
      .map(el => Number(el.textContent));
    check('le cumul des equipes est affiche', cumulEquipes.length === 2);
    check('les joueurs de chaque equipe totalisent le cumul de leur equipe',
          [0, 1].every(e => cumulEquipes[e] ===
            JOUEURS.filter(j => j.equipe === e).reduce((t, j) => t + j.serieTotal, 0)));

    // ===== Le resume bascule sur l echelle de la serie =====
    const resume = tiroir().querySelector('summary').textContent;
    log('       resume : "' + resume + '"');
    // Le nombre de parties prend la place du score : c est lui qui dit a
    // quelle echelle lire le tableau, le score y figure deja.
    check('le resume nomme le meilleur de la serie et annonce la serie',
          resume === '📊 Les joueurs — Ana en tête (3 parties)');
    check('et non Dan, qui menait sur cette partie seule',
          !resume.includes('Dan'));

    // ===== Le reste du tableau n a pas bouge =====
    check('l invite se retrouve toujours en evidence',
          d.querySelector('#resultats-tiroir-joueurs th.moi')?.textContent === 'Cleo');
    check('un trait separe encore les deux equipes',
          d.querySelectorAll('#resultats-tiroir-joueurs .change-equipe').length === 1);
    check('les trois manches restent detaillees',
          d.querySelectorAll('#resultats-scores .manche-passee').length === 3);

    // ===== Le tiroir ouvert survit aux lectures suivantes =====
    tiroir().open = true;
    d.querySelector('#resultats-tiroir-joueurs tbody tr').dataset.temoin = 'intact';
    await wait(5000);
    check('le tiroir ouvert ne se referme pas tout seul', tiroir()?.open === true);
    check('et le tableau n est pas reconstruit sans raison',
          d.querySelector('#resultats-tiroir-joueurs tbody tr')?.dataset.temoin === 'intact');

    log('SCENARIO 32 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
})();
</script>
</body>
</html>
