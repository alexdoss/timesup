<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — les joueurs s'inscrivent eux-mêmes</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote" style="display:flex;gap:8px"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

function cadre(src, largeur) {
  const f = document.createElement('iframe');
  f.src = src;
  f.style.cssText = `width:${largeur}px;height:1000px;border:1px solid #ccc`;
  document.getElementById('hote').appendChild(f);
  return new Promise(r => f.addEventListener('load', () => r(f), { once: true }));
}

localStorage.removeItem('timesup_partie_en_cours');
localStorage.removeItem('timesup_suivi');
localStorage.removeItem('timesup_rejoint');

(async () => {
  try {
    const app = await cadre('/', 400);
    const da = app.contentDocument, wa = app.contentWindow;
    wa.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
    const A = id => da.getElementById(id);
    const ecranApp = () => [...da.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;

    // Ce scenario eprouve le SUIVI. Le tour part vers le telephone du joueur
    // concerne : si c est celui de l invite, il verrait « a toi » au lieu du
    // miroir. On attend donc qu il soit spectateur, en reprenant la main autant
    // de fois qu il le faut — un tour confie arrive par le reseau, sans delai
    // garanti, et temporiser au jugé rendait ce scenario capricieux.
    async function attendreInviteSpectateur(I) {
      for (let i = 0; i < 10; i++) {
        if (A('attente-du-joueur').style.display !== 'none') A('btn-reprendre-tour').click();
        await wait(1000);
        if (I('bloc-lancement').style.display !== 'none') return true;
      }
      return false;
    }
    const inscrits = () => [...da.querySelectorAll('#inscription-joueurs .connecte:not(.vide)')]
      .map(e => e.querySelector('.qui').textContent.replace(/^●\s*/, '').trim());
    await wait(1200);

    // ===== L organisateur configure une partie a themes, avec les prenoms =====
    A('btn-start').click();
    da.querySelector('[data-source="themes"]').click();
    da.querySelectorAll('#theme-selector .btn-theme')[0].click();
    A('btn-next-step').click();
    check('l app demande comment on joue', ecranApp() === 'screen-jeu-mode');

    da.querySelector('[data-mode="nominatif"]').click();
    await wait(900);
    check('avec les prenoms, l app propose de faire scanner',
          ecranApp() === 'screen-inscription');

    const code = A('inscription-code').textContent.trim();
    log('       code de la soiree : ' + code);
    check('un code est propose', /^[A-Z0-9]{4}$/.test(code));
    check('un QR code est dessine', !!da.querySelector('#inscription-qr svg'));
    check('l adresse a recopier est donnee',
          A('inscription-adresse').textContent.includes('/rejoindre'));
    check('personne n est encore inscrit',
          da.querySelector('#inscription-joueurs .vide')?.textContent.includes('Personne'));
    check('le lancement est bloque', A('btn-inscription-suivant').disabled === true);
    log('       compteur : "' + A('inscription-compteur').textContent + '"');
    check('le compteur dit combien il en manque',
          A('inscription-compteur').textContent.includes('au moins 4'));

    // La session est ouverte, mais ne demande aucune carte
    const sess = (await api('etat', { code })).corps;
    log('       session : inscription=' + sess.inscription + ' ouverte=' + sess.ouverte);
    check('la session est marquee « inscription »', sess.inscription === true);
    check('elle est ouverte, on peut encore rejoindre', sess.ouverte === true);

    // ===== Deux invites s inscrivent par le reseau =====
    for (const prenom of ['Ana', 'Bob']) await api('rejoindre', { code, prenom });
    await wait(2600);
    log('       inscrits : ' + inscrits().join(', '));
    check('les prenoms arrivent sur l ecran de l organisateur',
          inscrits().includes('Ana') && inscrits().includes('Bob'));
    check('a 2 joueurs, le lancement reste bloque',
          A('btn-inscription-suivant').disabled === true);

    // ===== L organisateur se nomme : le champ est la d emblee =====
    check('son champ est offert sans rien deplier',
          A('inscription-moi-champ').style.display !== 'none');
    check('il est nomme sans ambiguite',
          A('inscription-moi-prenom').placeholder === 'Ton prénom');
    check('et sa ligne n existe pas encore',
          A('inscription-moi-ligne').style.display === 'none');

    A('inscription-moi-prenom').value = 'Alex';
    A('btn-inscription-moi-ok').click();
    await wait(900);
    log('       moi : "' + A('inscription-moi-ligne').textContent.trim() + '"');
    check('le champ cede la place a sa ligne',
          A('inscription-moi-champ').style.display === 'none'
          && A('inscription-moi-ligne').style.display !== 'none');
    check('il y est repere comme etant lui',
          A('inscription-moi-ligne').textContent.includes('Alex')
          && A('inscription-moi-ligne').textContent.includes('· toi'));
    check('il n apparait pas deux fois', !inscrits().some(p => p.includes('Alex')));
    check('a 3 joueurs, le lancement reste bloque',
          A('btn-inscription-suivant').disabled === true);

    // ===== Il se corrige : le crayon ramene le champ, garni =====
    A('btn-inscription-moi-corriger').click();
    check('le crayon ramene le champ', A('inscription-moi-champ').style.display !== 'none');
    check('garni du prenom actuel', A('inscription-moi-prenom').value === 'Alex');
    A('inscription-moi-prenom').value = 'Alexandre';
    A('btn-inscription-moi-ok').click();
    await wait(900);
    check('le prenom corrige remplace l ancien',
          A('inscription-moi-ligne').textContent.includes('Alexandre'));
    check('sans le dedoubler',
          !inscrits().some(p => p.includes('Alex')));
    check('l effectif n a pas bouge', A('btn-inscription-suivant').disabled === true);

    // ===== Un joueur sans telephone, inscrit par l organisateur =====
    A('btn-inscription-sanstel').click();
    A('inscription-ajout-prenom').value = 'Papi';
    A('btn-inscription-ajout-ok').click();
    await wait(900);
    log('       inscrits : ' + inscrits().join(', '));
    check('le joueur sans telephone rejoint la liste',
          inscrits().some(p => p.includes('Papi')));
    check('il est signale comme tel',
          [...da.querySelectorAll('#inscription-joueurs .connecte')]
            .some(e => e.textContent.includes('Papi') && e.textContent.includes('sans téléphone')));
    check('a 4 joueurs, le lancement s ouvre',
          A('btn-inscription-suivant').disabled === false);

    // ===== Le quatrieme invite ouvre la vraie page =====
    const inv = await cadre('/rejoindre.html?c=' + code, 400);
    const di = inv.contentDocument, wi = inv.contentWindow;
    wi.onerror = (m, s, l) => log('ERREUR INVITE: ' + m + ' @' + s + ':' + l);
    const I = id => di.getElementById(id);
    const L = id => I(id).textContent.trim();
    const ecranInv = () => [...di.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
    await wait(900);

    check('l invite arrive sur le prenom', ecranInv() === 'screen-prenom');
    I('champ-prenom').value = 'Cleo';
    I('btn-prenom').click();
    await wait(900);

    // ===== Une fois inscrit, il suit la partie. Point. =====
    // Aucun ecran ne lui demande s il veut suivre : il n y a plus de mode.
    log('       ecran invite : ' + ecranInv());
    check('on ne lui demande aucune carte', ecranInv() !== 'screen-cartes');
    check('il arrive directement sur le suivi', ecranInv() === 'screen-attente');
    check('aucun ecran ne lui demande s il veut suivre', !I('btn-inscrit-suivre'));
    check('aucun rappel de cartes : il n en a pas saisi',
          I('ruban-cartes').style.display === 'none');

    await wait(2600);
    log('       inscrits : ' + inscrits().join(', '));
    check('l organisateur le voit inscrit', inscrits().includes('Cleo'));
    check('et le compteur ne reclame plus personne',
          A('inscription-compteur').textContent.includes('5 joueurs inscrits'));

    check('il est bien dans la salle d attente', ecranInv() === 'screen-attente');
    log('       attente : "' + L('attente-titre') + '" — "' + L('attente-sous') + '"');
    check('on n y parle pas de cartes',
          L('attente-sous') === 'On attend que tout le monde se soit inscrit.');
    check('le decompte porte sur les inscrits',
          L('attente-total').includes('5 joueur(s) inscrit(s)'));
    check('aucun decompte de cartes par joueur',
          di.querySelectorAll('#attente-joueurs .etat').length === 0);
    check('il se reconnait dans la liste',
          di.querySelector('#attente-joueurs .sans-tel')?.textContent.includes('toi'));

    // ===== L organisateur passe aux equipes =====
    A('btn-inscription-suivant').click();
    await wait(900);
    check('on arrive sur les equipes', ecranApp() === 'screen-repartition');
    const equipiers = [...da.querySelectorAll('#repartition-liste .equipier')]
      .map(e => e.querySelector('span').textContent);
    log('       a repartir : ' + equipiers.join(', '));
    check('les cinq prenoms viennent des inscriptions', equipiers.length === 5);
    check('ce sont bien ceux qui se sont inscrits',
          equipiers.sort().join(',') === 'Alexandre,Ana,Bob,Cleo,Papi');
    check('les noms d equipes se reglent ici', !!A('team1-name') && !!A('team2-name'));

    // La session est close : plus personne ne peut s inscrire
    const apres = (await api('etat', { code })).corps;
    check('la session est fermee aux nouveaux venus', apres.ouverte === false);

    A('team1-name').value = 'Les Bleus';
    A('team1-name').dispatchEvent(new wa.Event('input', { bubbles: true }));
    check('renommer une equipe se voit sur les boutons',
          [...da.querySelectorAll('#repartition-liste .equipier button')]
            .some(b => b.textContent === 'Les Bleus'));

    // ===== L invite ne doit pas croire que la partie a demarre =====
    // Le suivi vient d etre active ; ses battements republient toutes les
    // 15 s. Publier « attente » — l etape du lancement de tour — pendant que
    // l organisateur nomme ses equipes ferait basculer les invites trop tot.
    await wait(2800);
    log('       invite pendant la configuration : "' + L('attente-titre') + '"');
    check('l invite reste sur la configuration',
          L('attente-titre') === 'Configuration de la partie en cours');
    check('et ne voit pas encore le lancement de tour',
          I('bloc-lancement').style.display === 'none');

    await wait(17000);   // au-dela d un battement
    log('       apres un battement : "' + L('attente-titre') + '"');
    check('un battement ne le fait pas basculer',
          I('bloc-lancement').style.display === 'none');
    check('il attend toujours', I('attente-roue').style.display !== 'none');

    A('btn-repartition-jouer').click();
    await wait(400);
    check('puis les manches', ecranApp() === 'screen-rounds');
    A('btn-next-rounds').click();
    A('btn-play').click();
    await wait(500);
    // Le code a deja ete donne a l inscription : rien a repartager
    check('aucune proposition de partage : le code est deja connu',
          A('dialog-overlay').style.display === 'none');
    check('la partie demarre directement', ecranApp() === 'screen-round');

    // ===== L invite suit, et se reconnait =====
    check('l invite voit le lancement de tour', await attendreInviteSpectateur(I));
    check('un joueur est nomme', L('lancement-joueur').length > 0);
    check('les equipes sont consultables', I('btn-voir-equipes').style.display !== 'none');
    I('btn-voir-equipes').click();
    await wait(200);
    log('       equipes vues par l invite : ' + I('equipes-contenu').textContent.trim());
    check('l equipe renommee lui parvient',
          I('equipes-contenu').textContent.includes('Les Bleus'));
    check('il s y retrouve', I('equipes-contenu').textContent.includes('Cleo'));

    // ===== REJOUER : l organisateur revient choisir le thème =====
    // On termine la partie sans se soucier du detail des scores.
    let garde = 0;
    while (ecranApp() !== 'screen-final' && garde++ < 40) {
      if (ecranApp() === 'screen-game') {
        let k = 0;
        while (ecranApp() === 'screen-game' && k < 400) { A('btn-found').click(); k++; }
        await wait(300);
      } else if (ecranApp() === 'screen-turn-end') { A('btn-next-turn').click(); await wait(400); }
      else if (ecranApp() === 'screen-round-end') { A('btn-next-round').click(); await wait(400); }
      else if (ecranApp() === 'screen-round') { A('btn-start-turn').click(); await wait(300); }
      else await wait(300);
    }
    check('la partie est terminee', ecranApp() === 'screen-final');

    await wait(2800);
    check('l invite voit les resultats', I('bloc-resultats').style.display !== 'none');
    check('il se retrouve dans le tableau des joueurs',
          di.querySelector('#resultats-tiroir-joueurs th.moi')?.textContent === 'Cleo');

    A('btn-replay').click();
    await wait(500);
    log('       organisateur apres Rejouer : ' + ecranApp());
    check('l organisateur revient choisir le theme de la partie suivante',
          ecranApp() === 'screen-themes');
    check('le bouton lance la partie',
          A('btn-next-step').textContent.includes("C'est parti"));
    check('ni les prenoms ni les equipes ne sont redemandes',
          ecranApp() !== 'screen-inscription' && ecranApp() !== 'screen-repartition');

    // ===== L invite n est pas fige sur le score de la partie precedente =====
    // Il n a aucune carte a ressaisir : rien a « rejoindre », c est la
    // publication suivante qui doit le ramener a l ecran d attente.
    await wait(2800);
    log('       invite pendant le choix : "' + L('attente-titre') + '"');
    check('l invite quitte le tableau des resultats',
          I('bloc-resultats').style.display === 'none');
    check('il retrouve l ecran de configuration',
          L('attente-titre') === 'Configuration de la partie en cours');
    check('on ne lui demande pas de se reinscrire', ecranInv() === 'screen-attente');

    // Un autre thème, et la partie repart
    const autre = [...da.querySelectorAll('#theme-selector .btn-theme')].filter(b => !b.disabled)[1];
    da.querySelector('#theme-selector .btn-theme.active').click();   // on decoche le precedent
    autre.click();
    A('btn-next-step').click();
    await wait(500);
    check('la partie suivante demarre', ecranApp() === 'screen-round');

    // Comme au premier tour : si le paquet part chez Cleo, l organisateur
    // reprend la main pour qu elle reste spectatrice.
    check('l invite suit la nouvelle partie', await attendreInviteSpectateur(I));
    check('avec les memes equipes', I('btn-voir-equipes').style.display !== 'none');

    log('SCENARIO 34 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
})();
</script>
</body>
</html>
