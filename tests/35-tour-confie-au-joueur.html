<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — le tour confié à un joueur</title></head>
<body>
<pre id="log">demarrage...</pre>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }

async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

const MOTS = ['Tire-bouchon', 'Boussole', 'Cléopâtre', 'Trampoline'];

(async () => {
  try {
    // ===== Une session, deux joueurs =====
    const creation = await api('creer', { inscription: true });
    const code = creation.corps.code, jeton = creation.corps.jeton;
    log('       session : ' + code);
    const marc = (await api('rejoindre', { code, prenom: 'Marc' })).corps;
    const sacha = (await api('rejoindre', { code, prenom: 'Sacha' })).corps;

    // ===== Avant tout, aucun tour n est confie =====
    const vide = await api('lireTour', { code, idJoueur: marc.idJoueur });
    check('au depart, aucun tour n est confie', vide.corps.tour === null);

    // ===== Confier le tour a Marc =====
    const refus = await api('confierTour', {
      code, jeton: 'faux', idJoueur: marc.idJoueur, mots: MOTS
    });
    check('un jeton invalide ne peut pas confier de tour', refus.statut === 403);

    const incomplet = await api('confierTour', { code, jeton, idJoueur: marc.idJoueur });
    check('un tour sans mots est refuse', incomplet.statut === 400);

    const confie = await api('confierTour', {
      code, jeton, idJoueur: marc.idJoueur, mots: MOTS, duree: 40,
      manche: { numero: 2, sur: 3, nom: 'Mime', icone: '🎭' }
    });
    check('l organisateur confie le tour', confie.statut === 200 && confie.corps.confie === true);

    // ===== Marc recoit ses mots =====
    const pourMarc = (await api('lireTour', { code, idJoueur: marc.idJoueur })).corps.tour;
    log('       Marc recoit : ' + JSON.stringify(pourMarc.mots));
    check('le joueur concerne recoit le paquet',
          JSON.stringify(pourMarc.mots) === JSON.stringify(MOTS));
    check('avec la duree du tour', pourMarc.duree === 40);
    check('et la manche en cours', pourMarc.manche.nom === 'Mime');
    check('rien n a encore ete rendu', !pourMarc.rendu);

    // ===== Sacha, lui, n apprend que l existence du tour =====
    const pourSacha = (await api('lireTour', { code, idJoueur: sacha.idJoueur })).corps.tour;
    log('       Sacha recoit : ' + JSON.stringify(pourSacha));
    check('un autre invite sait qu un tour est en cours', pourSacha.idJoueur === marc.idJoueur);
    check('mais AUCUN mot ne lui parvient', pourSacha.mots === undefined);
    check('ni la duree, qu il lit deja dans le suivi', pourSacha.duree === undefined);

    // ===== L organisateur, lui, voit tout =====
    const pourAdmin = (await api('lireTour', { code, jeton })).corps.tour;
    check('l organisateur garde acces au paquet confie',
          JSON.stringify(pourAdmin.mots) === JSON.stringify(MOTS));

    // ===== Sacha ne peut pas rendre le tour de Marc =====
    const usurpation = await api('rendreTour', {
      code, idJoueur: sacha.idJoueur, trouvees: MOTS, manquees: []
    });
    check('un autre joueur ne peut pas rendre ce tour', usurpation.statut === 403);

    // ===== Marc rend son tour =====
    const rendu = await api('rendreTour', {
      code, idJoueur: marc.idJoueur,
      trouvees: ['Tire-bouchon', 'Boussole'], manquees: ['Cléopâtre']
    });
    check('le joueur rend son tour', rendu.statut === 200 && rendu.corps.rendu === true);

    const apres = (await api('lireTour', { code, jeton })).corps.tour;
    log('       rendu : ' + JSON.stringify(apres.rendu.trouvees)
        + ' trouvees, ' + JSON.stringify(apres.rendu.manquees) + ' manquees');
    check('l organisateur lit ce qui a ete trouve',
          JSON.stringify(apres.rendu.trouvees) === JSON.stringify(['Tire-bouchon', 'Boussole']));
    check('et ce qui ne l a pas ete',
          JSON.stringify(apres.rendu.manquees) === JSON.stringify(['Cléopâtre']));
    check('les mots confies sont toujours la', apres.mots.length === 4);

    // Les autres apprennent que le tour est rendu, sans en connaitre le detail
    const vuDeSacha = (await api('lireTour', { code, idJoueur: sacha.idJoueur })).corps.tour;
    check('un autre invite sait que le tour est rendu', vuDeSacha.rendu === true);
    check('sans en connaitre le contenu', vuDeSacha.mots === undefined);

    // ===== L organisateur reprend la main =====
    const reprisFaux = await api('reprendreTour', { code, jeton: 'faux' });
    check('reprendre est reserve a l organisateur', reprisFaux.statut === 403);

    const repris = await api('reprendreTour', { code, jeton });
    check('l organisateur reprend la main', repris.statut === 200);

    // Reprendre MARQUE le tour, il ne l efface pas. C est la seule voie par
    // laquelle les cartes deja trouvees peuvent revenir : elles ne vivent que
    // sur le telephone du joueur, et n en partent qu avec son comptage.
    const marque = (await api('lireTour', { code, idJoueur: marc.idJoueur })).corps.tour;
    log('       apres reprise : ' + JSON.stringify({ repris: !!marque?.repris, rendu: !!marque?.rendu }));
    check('le tour est marque repris, pas efface', !!marque && !!marque.repris);
    check('le joueur peut encore rendre ce qu il avait compte',
          (await api('rendreTour', {
            code, idJoueur: marc.idJoueur, trouvees: ['Boussole'], manquees: [], restant: 12
          })).statut === 200);
    const recupere = (await api('lireTour', { code, jeton })).corps.tour;
    check('l organisateur y retrouve ses cartes',
          JSON.stringify(recupere.rendu.trouvees) === JSON.stringify(['Boussole']));
    check('et le temps qui lui restait', recupere.rendu.restant === 12);

    // Une fois recupere, l organisateur efface pour de bon : sans quoi le
    // telephone du joueur resterait devant un tour mort.
    const oubli = await api('reprendreTour', { code, jeton, oublier: true });
    check('l organisateur peut ensuite l effacer', oubli.statut === 200);
    check('le tour a alors disparu',
          (await api('lireTour', { code, idJoueur: marc.idJoueur })).corps.tour === null);

    // ===== Le suivi, lui, ne porte toujours aucun mot =====
    await api('confierTour', { code, jeton, idJoueur: marc.idJoueur, mots: MOTS });
    await api('publier', { code, jeton, v: 1, etat: {
      etape: 'tour', restantes: 4,
      equipes: [{ nom: 'Équipe 1', partie: 0 }, { nom: 'Équipe 2', partie: 0 }]
    } });
    const diffuse = JSON.stringify((await api('suivre', { code })).corps);
    check('aucun mot du paquet ne figure dans ce qui est diffuse a tous',
          !MOTS.some(mot => diffuse.includes(mot)));
    check('le suivi annonce quand meme combien il en reste',
          diffuse.includes('"restantes":4'));

    log('SCENARIO 35 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
})();
</script>
</body>
</html>
