<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — les doublons du paquet</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

localStorage.removeItem('timesup_partie_en_cours');

const f = document.createElement('iframe');
f.src = '/';
f.style.cssText = 'width:420px;height:1000px;border:1px solid #ccc';
document.getElementById('hote').appendChild(f);

let demarre = false;
f.addEventListener('load', async () => {
  if (demarre) return;
  demarre = true;

  const d = f.contentDocument, w = f.contentWindow;
  w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
  const $ = id => d.getElementById(id);
  const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
  const etat = () => JSON.parse(w.localStorage.getItem('timesup_partie_en_cours') || 'null')?.state;
  const boite = () => $('choix-overlay').style.display !== 'none';
  const actions = () => [...d.querySelectorAll('#choix-actions button')].map(b => b.textContent);
  const cliquer = texte => {
    const b = [...d.querySelectorAll('#choix-actions button')].find(x => x.textContent.includes(texte));
    if (!b) throw new Error('bouton introuvable : ' + texte);
    b.click();
  };

  async function invite(code, prenom, cartes) {
    const r = await api('rejoindre', { code, prenom });
    await api('deposer', { code, idJoueur: r.corps.idJoueur, cartes, fini: true });
  }

  // 3 joueurs x 5 cartes = 15 saisies. « plage » revient 3 fois (dont une en
  // majuscules : c est le meme mot), « valise » et « soleil » 2 fois chacun.
  // -> 15 cartes, 11 mots differents, 4 en trop.
  const ANA  = ['plage', 'valise', 'montagne', 'ski', 'hiver'];
  const BOB  = ['PLAGE', 'valise', 'soleil', 'pull', 'gants'];
  const CLEO = ['plage', 'soleil', 'chalet', 'luge', 'neige'];

  try {
    await wait(1200);

    $('btn-start').click();
    d.querySelector('[data-source="custom"]').click();
    $('btn-ouvrir-session').click();
    await wait(900);
    const code = $('session-code').textContent.trim();
    log('       session : ' + code);

    await invite(code, 'Ana',  ANA);
    await invite(code, 'Bob',  BOB);
    await invite(code, 'Cleo', CLEO);
    await wait(2600);
    check('le lancement s ouvre une fois tout le monde pret',
          $('btn-session-lancer').disabled === false);

    // ===== La boite s ouvre au « Suivant » =====
    $('btn-session-lancer').click();
    await wait(600);
    // 15 cartes : l app previent d abord que le paquet est court. On confirme.
    if ($('dialog-overlay').style.display !== 'none') { $('dialog-confirm').click(); await wait(600); }
    await wait(600);

    check('une boite annonce les doublons', boite());
    log('       titre : "' + $('choix-titre').textContent + '"');
    log('       texte : "' + $('choix-message').textContent + '"');

    // Trois nombres pouvaient pretendre au titre : 3 mots concernes, 7 cartes
    // impliquees, 4 en trop. C est le dernier qui compte — c est ce que le
    // nettoyage retire, et la taille du paquet fixe la duree des manches.
    check('le titre annonce les cartes EN TROP',
          $('choix-titre').textContent.includes('4 cartes en trop'));
    check('« en double » n est pas employe : un mot est ecrit trois fois',
          !$('choix-titre').textContent.includes('double'));
    check('le detail groupe les mots par nombre d occurrences',
          $('choix-message').textContent.includes('2 mots ont été écrits 2 fois')
          && $('choix-message').textContent.includes('1 mot 3 fois'));
    check('il rappelle la taille du paquet',
          $('choix-message').textContent.includes('11 mots différents sur 15 cartes'));

    // L organisateur joue lui aussi : lire les doublons lui donnerait des
    // cartes d avance. La boite ne dit que des nombres.
    const texteBoite = $('choix-overlay').textContent.toLowerCase();
    check('aucun mot du paquet n est affiche',
          !['plage', 'valise', 'soleil', 'chalet'].some(m => texteBoite.includes(m)));

    log('       actions : ' + JSON.stringify(actions()));
    check('trois issues sont proposees', actions().length === 3);
    check('toutes sont visibles, sans repli',
          !actions().some(t => t.includes('Autres options')));
    // Redemander leurs cartes aux joueurs n offre aucune garantie que la
    // seconde fournee soit meilleure : on ne le propose pas.
    check('on ne propose pas de rouvrir la saisie',
          !actions().some(t => t.toLowerCase().includes('saisie')));

    // ===== Ne garder qu un exemplaire =====
    cliquer("Ne garder qu'un exemplaire");
    await wait(900);
    check('la configuration reprend', ecran() === 'screen-jeu-mode');

    d.querySelector('[data-mode="simple"]').click();
    await wait(300);
    $('btn-repartition-jouer').click();
    await wait(300);
    $('btn-next-rounds').click();
    $('btn-play').click();
    await wait(900);
    if ($('dialog-overlay').style.display !== 'none') { $('dialog-cancel').click(); await wait(700); }

    const paquet = etat().masterDeck;
    log('       paquet : ' + JSON.stringify(paquet.slice().sort()));
    check('le paquet ne garde qu un exemplaire de chaque mot', paquet.length === 11);
    const cles = paquet.map(m => m.trim().toLowerCase());
    check('plus aucun doublon dedans', new Set(cles).size === cles.length);
    check('« plage » n y figure qu une fois, dans une seule graphie',
          paquet.filter(m => m.toLowerCase() === 'plage').length === 1);
    check('les mots ecrits une seule fois sont tous restes',
          ['montagne', 'ski', 'hiver', 'pull', 'gants', 'chalet', 'luge', 'neige']
            .every(m => cles.includes(m)));

    log('SCENARIO 37 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
