<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Test Rush — reprise après un rafraîchissement</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function check(name, cond) { log((cond ? 'PASS' : 'FAIL') + ' -- ' + name); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

function cadre(src) {
  const f = document.createElement('iframe');
  f.src = src;
  f.style.cssText = 'width:400px;height:1000px;border:1px solid #ccc';
  document.getElementById('hote').appendChild(f);
  return new Promise(r => f.addEventListener('load', () => r(f), { once: true }));
}

localStorage.removeItem('timesup_partie_en_cours');
localStorage.removeItem('timesup_suivi');

(async () => {
  try {
    // ===== Une partie a themes, nominative, avec trois telephones =====
    const app = await cadre('/');
    const da = app.contentDocument, wa = app.contentWindow;
    wa.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
    const A = id => da.getElementById(id);
    const ecran = () => [...da.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
    await wait(1200);

    A('btn-start').click();
    da.querySelector('[data-source="themes"]').click();
    da.querySelectorAll('#theme-selector .btn-theme')[0].click();
    A('btn-next-step').click();
    da.querySelector('[data-mode="nominatif"]').click();
    await wait(900);
    const code = A('inscription-code').textContent.trim();
    log('       session : ' + code);

    A('inscription-moi-prenom').value = 'Admin';
    A('btn-inscription-moi-ok').click();
    await wait(700);
    for (const p of ['Marc', 'Sacha', 'Nour']) await api('rejoindre', { code, prenom: p });
    await wait(2600);

    A('btn-inscription-suivant').click();
    await wait(900);
    A('btn-repartition-jouer').click();
    await wait(400);
    A('btn-next-rounds').click();
    A('btn-play').click();
    await wait(900);
    check('la partie demarre', ecran() === 'screen-round');

    // Si c est a l organisateur de jouer, on avance d un tour : le cas qui nous
    // interesse est celui ou le paquet part sur le telephone de quelqu un.
    if (A('btn-start-turn').style.display !== 'none'
        && A('attente-du-joueur').style.display === 'none') {
      log('       tour de l organisateur : on le joue pour passer au suivant');
      A('btn-start-turn').click();
      let n = 0;
      while (ecran() === 'screen-game' && n++ < 60) await wait(1000);
      A('btn-next-turn').click();
      await wait(900);
    }

    const quiJoue = A('current-player').textContent.trim();
    log('       a faire deviner : "' + quiJoue + '"');
    check('le tour est confie a un telephone',
          A('attente-du-joueur').style.display !== 'none');
    check('et l organisateur n a pas le bouton de lancement',
          A('btn-start-turn').style.display === 'none');

    // ===== L organisateur rafraichit sa page =====
    // Le client de session vit en memoire : le rechargement l efface. Le code
    // et le jeton, eux, sont dans le stockage du suivi. Sans les readopter,
    // l app oublie qu il existe des telephones et cesse de confier les tours,
    // sans rien dire — l organisateur recupere le bouton de lancement et peut
    // lancer le tour d un autre depuis son propre appareil.
    app.remove();
    const rouvert = await cadre('/');
    const dr = rouvert.contentDocument, wr = rouvert.contentWindow;
    wr.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
    const R = id => dr.getElementById(id);
    const ecranR = () => [...dr.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
    await wait(1500);

    check('la partie en cours est proposee a la reprise',
          R('resume-block').style.display !== 'none');
    R('btn-resume').click();
    await wait(2000);
    check('on revient sur le debut de tour', ecranR() === 'screen-round');
    log('       apres reprise : joueur "' + R('current-player').textContent.trim()
        + '" · lancement ' + R('btn-start-turn').style.display
        + ' · attente ' + R('attente-du-joueur').style.display);

    check('le meme joueur est annonce', R('current-player').textContent.trim() === quiJoue);
    check('l organisateur NE PEUT PAS lancer le tour d un autre',
          R('btn-start-turn').style.display === 'none');
    check('son ecran dit toujours qu on attend le telephone du joueur',
          R('attente-du-joueur').style.display !== 'none');
    check('avec le nom de qui l on attend',
          R('attente-joueur-nom').textContent.includes('téléphone'));

    // Le lien avec le serveur est bien retabli : le tour est reconfie
    const tour = (await api('lireTour', { code })).corps.tour;
    log('       tour cote serveur : ' + JSON.stringify(tour));
    check('un tour est bien confie cote serveur', !!tour && !tour.rendu);

    // ===== Et la porte de sortie fonctionne toujours =====
    R('btn-reprendre-tour').click();
    await wait(900);
    check('l organisateur peut reprendre le tour sur son appareil',
          R('btn-start-turn').style.display !== 'none');
    const repris = (await api('lireTour', { code })).corps.tour;
    check('le tour confie est annule', repris === null);

    log('SCENARIO 39 TERMINE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
})();
</script>
</body>
</html>
