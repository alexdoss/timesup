<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Sonde — ce qui est publié pendant la configuration (cartes perso)</title></head>
<body>
<pre id="log">demarrage...</pre>
<div id="hote"></div>
<script>
const out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function api(action, donnees = {}) {
  const r = await fetch('/api/session', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...donnees })
  });
  return { statut: r.status, corps: await r.json().catch(() => ({})) };
}

localStorage.removeItem('timesup_partie_en_cours');
localStorage.removeItem('timesup_suivi');

(async () => {
  try {
    const f = document.createElement('iframe');
    f.src = '/';
    f.style.cssText = 'width:400px;height:900px;border:1px solid #ccc';
    document.getElementById('hote').appendChild(f);
    await new Promise(r => f.addEventListener('load', r, { once: true }));
    const d = f.contentDocument, w = f.contentWindow;
    w.onerror = (m, s, l) => log('ERREUR APP: ' + m + ' @' + s + ':' + l);
    const A = id => d.getElementById(id);
    const ecran = () => [...d.querySelectorAll('.screen')].find(s => s.classList.contains('active'))?.id;
    await wait(1200);

    // Cartes perso, session partagee
    A('btn-start').click();
    d.querySelector('[data-source="custom"]').click();
    for (let i = 0; i < 4; i++) A('btn-joueurs-plus').click();
    A('btn-cartes-moins').click();
    A('btn-cartes-moins').click();
    A('btn-ouvrir-session').click();
    await wait(900);
    const code = A('session-code').textContent.trim();
    log('session : ' + code);

    for (const p of ['Ana', 'Bob', 'Cleo', 'Dan']) {
      const r = await api('rejoindre', { code, prenom: p });
      await api('deposer', { code, idJoueur: r.corps.idJoueur,
        cartes: [p + '1', p + '2', p + '3'], fini: true });
    }
    await wait(2600);

    A('btn-session-lancer').click();
    await wait(700);
    if (A('dialog-overlay').style.display !== 'none') A('dialog-confirm').click();
    await wait(900);
    log('ecran organisateur : ' + ecran());

    // On reste la, sans rien faire, et on regarde ce qui part
    for (let t = 0; t <= 50; t += 5) {
      const s = (await api('suivre', { code })).corps.suivi;
      log(`  t+${t}s · ecran=${ecran()} · publie: etape=${s?.etat?.etape} v=${s?.v}`);
      await wait(5000);
    }

    // Puis on avance jusqu aux manches, et on attend encore
    if (ecran() === 'screen-jeu-mode') d.querySelector('[data-mode="nominatif"]').click();
    await wait(600);
    if (ecran() === 'screen-repartition') A('btn-repartition-jouer').click();
    await wait(600);
    log('ecran organisateur : ' + ecran());
    for (let t = 0; t <= 40; t += 5) {
      const s = (await api('suivre', { code })).corps.suivi;
      log(`  t+${t}s · ecran=${ecran()} · publie: etape=${s?.etat?.etape} v=${s?.v}`);
      await wait(5000);
    }

    log('SONDE TERMINEE');
  } catch (e) { log('EXCEPTION: ' + e.message + '\n' + e.stack); }
})();
</script>
</body>
</html>
